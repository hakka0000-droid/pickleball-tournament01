<header><div class="inner"><div class="authline"><span class="tag">Supabase v10 開発プレビュー</span><span class="light mini">V9デザイン踏襲</span></div><h1>Pickleball Tournament Manager</h1><small class="light">試合確認・結果入力・順位チェック</small></div></header>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opt=(value,label,selected)=>`<option value="${esc(value)}" ${value===selected?'selected':''}>${esc(label)}</option>`;
const CONF=window.PICKLEBALL_SUPABASE_CONFIG||{};
const TABS=[['home','概要'],['matches','試合一覧'],['courts','コート別'],['bracket','決勝トーナメント'],['ranking','順位'],['pairs','ペア検索'],['manage','大会管理']];
const state={tab:'home',loading:false,error:'',auth:null,staff:false,staffError:'',systemAdmin:false,systemAdminLoaded:false,systemAdminError:'',tournamentAdminIds:[],tournamentAdminLoaded:false,tournamentAdminError:'',tournaments:[],categories:[],stages:[],pairs:[],matches:[],courts:[],category:'all',tournament:'all',pair:'',group:'',rankings:[],approved:[],rankingError:'',bracketError:'',bracketSlots:[],officialResults:[],officialError:"",officialLoaded:false,rankingRows:{},rankingLoadErrors:{},rankingLoading:false,approvedLoaded:false,approvedError:'',qualificationLocks:[],qualificationLocksLoaded:false,qualificationLocksError:'',courtLoadError:'',lastLoaded:null};
const categoryForm={tournamentId:'9809c9a9-aec9-44fb-bcfc-e186e69cef51',selectedLevels:[1],division:'フリー',displayOrder:0};
const CATEGORY_LEVELS=['初心者','初級','初中級','中級','中上級','上級'];
const CATEGORY_DIVISIONS=['男性','女性','ミックス','フリー'];
// Planning is local until an administrator explicitly saves one category through the RPC.
const capacityPlans={};
const capacityPlanDirty=new Set();
const capacityPlanSaving=new Set();
const capacityPlanMessages={};
const planKey=(t,c)=>`${t}:${c}`;
function editCapacityPlan(t,c,field,value){getCapacityPlan(t,c)[field]=value;capacityPlanDirty.add(planKey(t,c));delete capacityPlanMessages[planKey(t,c)];}
function hydrateCapacityPlans(categories){
 for(const c of categories){
  const key=planKey(c.tournament_id,c.id);
  if(capacityPlanDirty.has(key)||capacityPlanSaving.has(key))continue;
  if(!capacityPlans[c.tournament_id])capacityPlans[c.tournament_id]={};
  const saved=[c.planned_pairs,c.preliminary_group_max_pairs,c.qualifiers_per_group,c.final_format];
  capacityPlans[c.tournament_id][c.id]=saved.every(v=>v!==null&&v!==undefined)
   ?{pairs:String(saved[0]),groupSize:String(saved[1]),advance:String(saved[2]),finalFormat:String(saved[3])}
   :{pairs:String(PLAN_DEFAULT_PAIRS),advance:'2',groupSize:'4',finalFormat:'knockout'};
 }
}
const PLAN_DEFAULT_PAIRS=16;
function planGroupings(pairCount,advancePerGroup,maxGroupSize,finalFormat='knockout'){
 const n=Number(pairCount),advance=Number(advancePerGroup),maxSize=Number(maxGroupSize);
 if(!Number.isInteger(n)||n<3||n>64||![1,2].includes(advance)||![3,4,5,6].includes(maxSize))return null;
 // The selected size is a maximum. Use the fewest groups, distributed as evenly as possible.
 const groupCount=Math.ceil(n/maxSize);
 const base=Math.floor(n/groupCount),remainder=n%groupCount;
 const sizes=Array.from({length:groupCount},(_,i)=>base+(i<remainder?1:0));
 if(sizes.some(size=>size<3||size>maxSize||size<advance))return null;
 const preliminary=sizes.reduce((sum,size)=>sum+size*(size-1)/2,0);
 const qualifiers=groupCount*advance;
 if(!['knockout','round_robin'].includes(finalFormat))return null;
 const knockout=finalFormat==='round_robin'?qualifiers*(qualifiers-1)/2:Math.max(0,qualifiers-1);
 return {sizes,preliminary,qualifiers,knockout,finalFormat,total:preliminary+knockout};
}
function getCapacityPlan(tournamentId,categoryId){
 if(!capacityPlans[tournamentId])capacityPlans[tournamentId]={};
 return capacityPlans[tournamentId][categoryId]||(capacityPlans[tournamentId][categoryId]={pairs:String(PLAN_DEFAULT_PAIRS),advance:'2',groupSize:'4',finalFormat:'knockout'});
}
// Scenario calculation is local-only. Display the latest of four hypothetical outcomes;
// never claim all real winners or double-entries have been validated.
const planningSimulation={qualificationMinutes:15};

// STEP 171: final-stage format selectable per category; local-only provisional search. Never writes to Supabase.
const recruitmentOptimization={bufferMinutes:15,result:null,tournamentId:null,signature:null,busy:false};
function recruitmentSignature(t,categories,courts){return JSON.stringify({id:t?.id,start:t?.start_time,end:t?.end_time,match:t?.match_minutes,rest:t?.minimum_rest_minutes,consecutive:t?.max_consecutive_matches,courts,qualification:planningSimulation.qualificationMinutes,buffer:recruitmentOptimization.bufferMinutes,categories:categories.map(c=>{const p=getCapacityPlan(t.id,c.id);return [c.id,p.groupSize,p.advance,p.finalFormat||'knockout']})});}
function recruitmentCandidateCounts(groupMax,advance,finalFormat){
 const counts=[4,6,8,10,12,16,20,24,32,40,48,56,64];
 return counts.map(n=>{const r=planGroupings(n,advance,groupMax,finalFormat);return r?{pairs:n,total:r.total,groupSizes:r.sizes}:null}).filter(Boolean);
}
function calculateRecruitmentSuggestion(t,categories,courtCount,buffer){
 if(!t||!categories.length||categories.length>8)throw Error('対象カテゴリー数は1〜8件で設定してください。');
 const clock=v=>{const v0=String(v||'').slice(0,5);if(!/^\d\d:\d\d$/.test(v0))throw Error('開催時刻が未設定です');const [h,m]=v0.split(':').map(Number);if(h>23||m>59)throw Error('開催時刻が不正です');return h*60+m};
 const start=clock(t.start_time),end=clock(t.end_time),match=Number(t.match_minutes),rest=Number(t.minimum_rest_minutes??0),consecutive=Number(t.max_consecutive_matches??2);
 if(start>=end||!Number.isInteger(match)||match<1||!Number.isInteger(courtCount)||courtCount<1||!Number.isInteger(buffer)||buffer<0||end-120-buffer<=start)throw Error('開催時間・コート・余裕時間を見直してください。');
 const theoretical=courtCount*Math.floor(Math.max(0,end-start-120-buffer)/match);
 const all=categories.map(c=>{const p=getCapacityPlan(t.id,c.id);return recruitmentCandidateCounts(Number(p.groupSize),Number(p.advance),p.finalFormat||'knockout')});
 if(all.some(x=>!x.length))return {status:'no_candidates',trials:0};
 // Beam search bounds both runtime and memory as category count increases.
 let beam=[{items:[],matches:0,pairs:0,low:0,high:0}];
 const width=1600,maxGap=8;
 for(let i=0;i<categories.length;i++){
  const next=[];
  for(const state0 of beam)for(const item of all[i]){
   const lo=i?Math.min(state0.low,item.pairs):item.pairs,hi=i?Math.max(state0.high,item.pairs):item.pairs;
   if(hi-lo>maxGap||state0.matches+item.total>theoretical)continue;
   next.push({items:[...state0.items,item],matches:state0.matches+item.total,pairs:state0.pairs+item.pairs,low:lo,high:hi});
  }
  next.sort((a,b)=>b.pairs-a.pairs||(a.high-a.low)-(b.high-b.low)||a.matches-b.matches);
  beam=next.slice(0,width);
  if(!beam.length)return {status:'no_candidates',trials:0};
 }
 let trials=0;
 const effectiveEnd=String(Math.floor((end-buffer)/60)).padStart(2,'0')+':'+String((end-buffer)%60).padStart(2,'0');
 for(const suggestion of beam.slice(0,120)){
  trials++;
  const plans=categories.map((c,i)=>{const p=getCapacityPlan(t.id,c.id);return {name:c.name,pairs:suggestion.items[i].pairs,groupMax:Number(p.groupSize),advance:Number(p.advance),finalFormat:p.finalFormat||'knockout'}});
  const r=v10ScheduleEngine.simulate({start:String(t.start_time).slice(0,5),end:effectiveEnd,reservedMinutes:120,matchMinutes:match,restMinutes:rest,maxConsecutive:consecutive,courts:courtCount,qualificationMinutes:planningSimulation.qualificationMinutes,categories:plans,scenarios:4});
  if(r.status==='fits_all_tested_scenarios'){
   const worst=Math.max(...r.runs.map(v=>v.finishMinute));
   const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
   return {status:'provisional_fit',suggestions:categories.map((c,i)=>({id:c.id,name:c.name,...suggestion.items[i]})),totalPairs:suggestion.pairs,totalMatches:suggestion.matches,theoretical,finish:fmt(worst),deadline:fmt(end-120-buffer),remaining:end-120-buffer-worst,trials};
  }
 }
 return {status:'no_fit_found',trials,examined:beam.length};
}
function recruitmentOptimizationSection(t,categories,courts,availableSlots){
 if(!t||!categories.length)return '';
 const current=recruitmentOptimization,valid=current.tournamentId===t.id&&current.signature===recruitmentSignature(t,categories,courts);
 const result=valid?current.result:null;
 const choices=[0,10,15,20,30,45,60];
 const ready=availableSlots!==null&&courts>0&&t.start_time&&t.end_time;
 const report=!result?'':result.status==='provisional_fit'?`<div class="notice blue">仮の勝敗4パターンで配置できた暫定案です。最適解の保証はありません。</div><div class="tablebox"><table class="tbl"><thead><tr><th>カテゴリー</th><th>提案募集ペア数</th><th>予選構成</th><th>必要試合数</th></tr></thead><tbody>${result.suggestions.map(x=>`<tr><td>${esc(x.name)}</td><td><b>${x.pairs}ペア</b></td><td>${esc(x.groupSizes.join('・'))}</td><td>${x.total}試合</td></tr>`).join('')}</tbody></table></div><div class="metrics"><div class="metric"><small>合計募集数</small><strong>${result.totalPairs}ペア</strong></div><div class="metric"><small>必要試合数</small><strong>${result.totalMatches}試合</strong></div><div class="metric"><small>仮の終了時刻</small><strong>${esc(result.finish)}</strong></div></div><p class="prompt">余裕時間を含めた終了期限：${esc(result.deadline)} ／ 残り：${result.remaining}分 ／ 検証候補：${result.trials}件</p><button class="btn wide" id="applyRecruitmentSuggestion">この提案をシミュレーションへ反映</button>`:`<div class="notice">${result.status==='no_candidates'?'予選グループ・理論収容力に収まる募集枠候補がありません。':'探索した候補では時間内の仮配置を確認できませんでした。開催不可能という意味ではありません。'} （検証：${result.trials}件）</div>`;
 return `<h2>募集枠の自動提案</h2><div class="card stack"><p class="prompt">各カテゴリーの予選グループ人数・進出条件を維持し、募集ペア数を暫定提案します。公平性のためカテゴリー間の募集数差を最大8ペアに制限します。</p><div><label for="recruitmentBuffer">公式戦終了期限まで確保したい余裕（分）</label><select class="field" id="recruitmentBuffer">${choices.map(n=>opt(String(n),`${n}分`,String(current.bufferMinutes))).join('')}</select></div><button class="btn wide" id="optimizeRecruitment" ${ready&&!current.busy?'':'disabled'}>${current.busy?'計算中…':'募集枠を自動提案'}</button>${!ready?'<p class="notice">開催時間と公式戦用コートの登録が必要です。</p>':''}${report}<p class="prompt">候補ペア数：4・6・8・10・12・16・20・24・32・40・48・56・64。最大1,600候補を段階的に保持し、仮スケジュールを最大120候補×4パターン検証します。探索のため最大募集数は保証しません。余裕時間は従来の運営用120分とは別枠です。ダブルエントリー未反映。提案・シミュレーションへの反映だけではSupabaseに保存されません。保存するには各カテゴリーの保存ボタンを押してください。</p></div>`;
}
function optimizeRecruitmentClick(){
 if(recruitmentOptimization.busy)return;
 const t=state.tournaments.find(x=>x.id===categoryForm.tournamentId),cats=state.categories.filter(c=>c.tournament_id===t?.id).sort((a,b)=>a.display_order-b.display_order||a.name.localeCompare(b.name,'ja'));
 const courtCount=state.courts.filter(c=>c.tournament_id===t?.id&&c.is_active===true&&c.court_type==='official').length;
 if(!t||state.courtLoadError)return;
 const signature=recruitmentSignature(t,cats,courtCount);
 recruitmentOptimization.busy=true;recruitmentOptimization.result=null;render();
 setTimeout(()=>{try{const result=calculateRecruitmentSuggestion(t,cats,courtCount,recruitmentOptimization.bufferMinutes);recruitmentOptimization.result=result;recruitmentOptimization.tournamentId=t.id;recruitmentOptimization.signature=signature;}catch(e){alert('自動提案できませんでした：'+e.message);}finally{recruitmentOptimization.busy=false;render();}},0);
}
function applyRecruitmentSuggestion(){
 const result=recruitmentOptimization.result,t=state.tournaments.find(x=>x.id===categoryForm.tournamentId),cats=state.categories.filter(c=>c.tournament_id===t?.id);
 const count=state.courts.filter(c=>c.tournament_id===t?.id&&c.is_active&&c.court_type==='official').length;
 if(!t||!result||result.status!=='provisional_fit'||recruitmentOptimization.tournamentId!==t.id||recruitmentOptimization.signature!==recruitmentSignature(t,cats.sort((a,b)=>a.display_order-b.display_order||a.name.localeCompare(b.name,'ja')),count))return;

// STEP 175: conservative per-category lower bounds for the final stage.
// These are necessary-time checks, not a proof that a full schedule fits.
function finalStageTimeDiagnostics(categories,run,matchMinutes,restMinutes,maxConsecutive){
 const prelimEnd=run?.preliminaryEndMinute;
 const earliest=run?.knockoutEarliestMinute;
 const deadline=run?.deadlineMinute;
 if(!Number.isFinite(prelimEnd)||!Number.isFinite(earliest)||!Number.isFinite(deadline))return '';
 const slotGap=matchMinutes*Math.max(1,Math.ceil((matchMinutes+restMinutes)/matchMinutes));
 const clock=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
 const rows=categories.map(c=>{
  const r=planGroupings(c.pairs,c.advance,c.groupMax,c.finalFormat||'knockout');
  if(!r)return null;
  const n=r.qualifiers,format=c.finalFormat||'knockout';
  // In a round robin every finalist plays n-1 games. A knockout champion
  // must play at least floor(log2(n)) games (BYE may shorten the path).
  const games=format==='round_robin'?Math.max(0,n-1):n<2?0:Math.floor(Math.log2(n));
  // If consecutive games are forbidden, a gap of one slot is also required.
  const gap=restMinutes>0||maxConsecutive===1?Math.max(slotGap,matchMinutes*2):matchMinutes;
  const minDuration=games?matchMinutes+(games-1)*gap:0;
  const earliestFinish=earliest+minDuration;
  return {name:c.name,format,games,minDuration,earliestFinish,shortfall:Math.max(0,earliestFinish-deadline)};
 }).filter(Boolean);
 const failures=rows.filter(r=>r.shortfall>0);
 const headline=failures.length?'決勝の最低必要時間だけで公式戦終了期限を超過しています。':'決勝の最低必要時間だけでは時間不足を確認できません。実際の配置可否は別途検証が必要です。';
 const table=rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.format==='round_robin'?'総当たり':'トーナメント'}</td><td>${r.games}試合／ペア（下限）</td><td>${r.minDuration}分</td><td>${clock(r.earliestFinish)}</td><td>${r.shortfall?`<b>${r.shortfall}分不足</b>`:'下限内'}</td></tr>`).join('');
 return `<div class="notice ${failures.length?'':'blue'}"><b>決勝の最低必要時間チェック</b><p>${esc(headline)}</p><p class="prompt">全予選終了 ${clock(prelimEnd)} ／ 決勝開始可能 ${clock(earliest)} ／ 公式戦終了期限 ${clock(deadline)}</p><div class="tablebox"><table class="tbl"><thead><tr><th>カテゴリー</th><th>決勝形式</th><th>1ペアの必要試合</th><th>最短所要</th><th>最早終了</th><th>判定</th></tr></thead><tbody>${table}</tbody></table></div><p class="prompt">決勝開始可能時刻からの理論的な下限です。コートの競合、他ペアとの対戦順、予選後の個別休憩、実選手のダブルエントリーは考慮していません。下限内でも配置成功は保証されません。トーナメントの必要試合数はBYEを考慮した最短経路の下限です。</p></div>`;
}

const v10ScheduleEngine=(()=>{

// STEP 161: recruitment-stage scenario simulator. Pure JavaScript; no DB writes.
const distribute=(n,maxSize)=>{const groups=Math.ceil(n/maxSize),base=Math.floor(n/groups),rem=n%groups;const sizes=Array.from({length:groups},(_,i)=>base+(i<rem?1:0));return sizes.every(v=>v>=3&&v<=maxSize)?sizes:null;};
const choose2=n=>n*(n-1)/2;
const time=v=>{if(!/^\d\d:\d\d$/.test(v))throw Error('invalid HH:MM');const [h,m]=v.split(':').map(Number);if(h>23||m>59)throw Error('invalid clock');return h*60+m;};
const fmt=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const power2=n=>2**Math.ceil(Math.log2(n));
function buildCategory(c,ci,scenario){
 const sizes=distribute(c.pairs,c.groupMax);
 if(!sizes)return {error:'3ペア以上で均等配分できません',category:c.name};
 const advance=c.advance??2;
 if(!Number.isInteger(advance)||advance<1||sizes.some(x=>advance>x))throw Error('invalid advance');
 const prelim=[],qualifiers=[];
 sizes.forEach((size,gi)=>{
  const ids=Array.from({length:size},(_,i)=>`C${ci}-G${gi}-P${i}`);
  for(let i=0;i<size;i++)for(let j=i+1;j<size;j++)prelim.push({id:`P-${ci}-${gi}-${i}-${j}`,phase:'preliminary',category:c.name,round:0,group:gi+1,pairs:[ids[i],ids[j]]});
  // Each outcome scenario picks hypothetical qualifiers from this group.
  const rotated=ids.map((_,i)=>ids[(i+(scenario%size))%size]);
  qualifiers.push(...rotated.slice(0,advance));
 });
 // Provisional final matches, independent of the database bracket.
 const finalFormat=c.finalFormat||'knockout';
 if(!['knockout','round_robin'].includes(finalFormat))throw Error('invalid final format');
 const knockouts=[];let participants=qualifiers.slice(),round=1;
 if(finalFormat==='round_robin'){
  for(let i=0;i<participants.length;i++)for(let j=i+1;j<participants.length;j++)knockouts.push({id:`R-${ci}-${i}-${j}`,phase:'knockout',category:c.name,round:1,pairs:[participants[i],participants[j]]});
 }else if(participants.length>=2){
  const bracketSlots=power2(participants.length);
  const byeCount=bracketSlots-participants.length;
  // The fixed BYE seeds advance without creating a scheduled match.
  const byeSeeds=participants.slice(0,byeCount),roundOne=participants.slice(byeCount);
  let next=byeSeeds;
  for(let i=0;i<roundOne.length;i+=2){
   const pair=[roundOne[i],roundOne[i+1]];
   knockouts.push({id:`K-${ci}-${round}-${i/2}`,phase:'knockout',category:c.name,round,pairs:pair});
   next.push(pair[scenario%2]);
  }
  participants=next;round++;
  while(participants.length>1){
   const winners=[];
   for(let i=0;i<participants.length;i+=2){
    const pair=[participants[i],participants[i+1]];
    knockouts.push({id:`K-${ci}-${round}-${i/2}`,phase:'knockout',category:c.name,round,pairs:pair});
    winners.push(pair[(scenario+round+i/2)%2]);
   }
   participants=winners;round++;
  }
 }
 const summary={category:c.name,pairs:c.pairs,groupMax:c.groupMax,groupSizes:sizes,qualifiers:qualifiers.length,finalFormat,preliminary:prelim.length,knockout:knockouts.length,total:prelim.length+knockouts.length};
 if(summary.preliminary!==sizes.reduce((s,x)=>s+choose2(x),0)||summary.knockout!==(finalFormat==='round_robin'?choose2(qualifiers.length):Math.max(0,qualifiers.length-1)))throw Error('count mismatch');
 return {prelim,knockouts,summary};
}
function scheduleScenario(config,scenario=0){
 const {start='09:00',end='17:00',reservedMinutes=120,matchMinutes=15,restMinutes=5,maxConsecutive=2,courts=4,qualificationMinutes=15,categories=[]}=config;
 const begin=time(start),endMinute=time(end);
 if(begin>=endMinute||![reservedMinutes,matchMinutes,restMinutes,maxConsecutive,courts,qualificationMinutes].every(Number.isInteger)||reservedMinutes<0||matchMinutes<1||restMinutes<0||maxConsecutive<1||courts<1||courts>100||qualificationMinutes<0)throw Error('invalid tournament settings');
 const deadline=Math.max(begin,endMinute-reservedMinutes),built=categories.map((c,i)=>buildCategory(c,i,scenario));
 if(built.some(c=>c.error))return {status:'invalid_groups',scenario,summaries:built.map(c=>c.summary||c),schedule:[]};
 const summaries=built.map(c=>c.summary),schedule=[],lastEnd=new Map(),lastStart=new Map(),streak=new Map(),busy=new Set();
 const canPlay=(task,at)=>task.pairs.every(p=>{const end=lastEnd.get(p);return end===undefined||at-end>=restMinutes;})&&task.pairs.every(p=>{const last=lastStart.get(p);return last===undefined||last!==at-matchMinutes||(streak.get(p)||0)<maxConsecutive;});
 const add=(task,at,court)=>{
  const key=`${at}:${court}`;if(busy.has(key))throw Error('court overlap');busy.add(key);
  for(const p of task.pairs){const adj=lastStart.get(p)===at-matchMinutes;streak.set(p,adj?(streak.get(p)||0)+1:1);lastEnd.set(p,at+matchMinutes);lastStart.set(p,at);}
  schedule.push({...task,startMinute:at,endMinute:at+matchMinutes,court});
 };
 function phase(tasks,first){
  let pending=tasks.slice(),at=first;
  for(let guard=0;pending.length&&at+matchMinutes<=deadline&&guard<10000;guard++,at+=matchMinutes){
   // Prefer pairs waiting longest, and spread assignments across available courts.
   pending.sort((x,y)=>Math.min(...x.pairs.map(p=>lastEnd.get(p)??-100000))-Math.min(...y.pairs.map(p=>lastEnd.get(p)??-100000)));
   const rem=[],used=new Set();let court=1;
   for(const task of pending){
    if(court<=courts&&!task.pairs.some(p=>used.has(p))&&canPlay(task,at)){
     add(task,at,court++);task.pairs.forEach(p=>used.add(p));
    }else rem.push(task);
   }
   pending=rem;
  }
  return {pending,next:at};
 }
 let progress=phase(built.flatMap(c=>c.prelim),begin);
 if(progress.pending.length)return {status:'not_scheduled_by_greedy',scenario,phase:'preliminary',unscheduled:progress.pending.length+summaries.reduce((a,s)=>a+s.knockout,0),summaries,schedule,deadlineMinute:deadline,finishMinute:Math.max(begin,...schedule.map(s=>s.endMinute))};
 const preliminaryEnd=Math.max(begin,...schedule.map(s=>s.endMinute));
 // Explicit time for standings approval/qualifier confirmation before the final stage starts.

function slotDiagram(slots,cat,stage){
  const ordered=[...slots].sort((a,b)=>a.round_number-b.round_number||a.match_number-b.match_number);
  if(!ordered.length)return '<div class="empty">対戦枠がありません。</div>';
  const byId=new Map(ordered.map(s=>[s.id,s]));
  const matchById=new Map(state.matches.map(m=>[m.id,m]));
  const highest=Math.max(...ordered.map(s=>s.round_number));
  const first=ordered.filter(s=>s.round_number===1);
  const center=new Map();
  // Preserve bracket topology using each slot's actual next_slot_id.
  first.forEach((s,i)=>center.set(s.id,75+i*135));
  for(let round=2;round<=highest;round++){
    ordered.filter(s=>s.round_number===round).forEach((s,i)=>{
      const children=ordered.filter(x=>x.next_slot_id===s.id&&center.has(x.id));
      if(children.length)center.set(s.id,children.reduce((a,x)=>a+center.get(x.id),0)/children.length);
      else center.set(s.id,75+i*135*Math.pow(2,round-1));
    });
  }
  const colWidth=234,cardWidth=194,cardHeight=94;
  const boardWidth=highest*colWidth+12;
  const boardHeight=Math.max(180,...[...center.values()].map(y=>y+cardHeight/2+18));
  const path=ordered.filter(s=>s.next_slot_id&&byId.has(s.next_slot_id)).map(s=>{
    const target=byId.get(s.next_slot_id),x1=12+(s.round_number-1)*colWidth+cardWidth,
      x2=12+(target.round_number-1)*colWidth,
      y1=center.get(s.id),y2=center.get(target.id),mid=(x1+x2)/2;
    return `<path d="M ${x1} ${y1} H ${mid} V ${y2} H ${x2}" stroke="#90afb6" stroke-width="1.7" fill="none"/>`;
  }).join('');
  const cards=ordered.map(s=>{
    const m=matchById.get(s.match_id),x=12+(s.round_number-1)*colWidth,y=center.get(s.id)-cardHeight/2;
    if(!m)return `<div class="bracket-match" style="left:${x}px;top:${y}px"><small>試合情報を取得できません</small></div>`;
    const winner=isWalkover(m)?m.walkover_winner_pair_id:isDone(m)?(m.score_a>m.score_b?m.pair_a_id:m.pair_b_id):null;
    const line=(id,score)=>`<div class="bracket-team ${winner&&winner===id?'win':''}"><span title="${esc(pairName(id))}">${esc(pairName(id))}</span><b>${score??''}</b></div>`;
    const label=s.round_number===highest?'決勝':s.round_number===highest-1?'準決勝':`${s.round_number}回戦`;
    return `<div class="bracket-match ${s.round_number===highest&&winner?'final-winner':''}" style="left:${x}px;top:${y}px"><div class="bracket-head"><span>${esc(label)} ${s.match_number}</span><span>${isWalkover(m)?'不戦勝':isDone(m)?'終了':m.status==='playing'?'試合中':'予定'}</span></div>${line(m.pair_a_id,m.score_a)}${line(m.pair_b_id,m.score_b)}${state.staff&&!officialLocked(m.category_id)&&m.pair_a_id&&m.pair_b_id?`<button class="btn secondary" data-edit="${esc(m.id)}">結果を操作</button>`:''}</div>`;
  }).join('');
  return `<div class="bracket-legend"><span>緑：勝者</span><span>線：次ラウンドへの接続</span><span>横スクロールで全ラウンド表示</span></div><div class="bracket-scroller"><div class="bracket-board" style="width:${boardWidth}px;height:${boardHeight}px"><svg class="bracket-lines" width="${boardWidth}" height="${boardHeight}" viewBox="0 0 ${boardWidth} ${boardHeight}" aria-hidden="true">${path}</svg>${cards}</div></div>`;
}
function championSummary(slots) {

  const lastRound=Math.max(...slots.map(s=>Number(s.round_number)));
  const finalSlots=slots.filter(s=>Number(s.round_number)===lastRound);
  // Only a single final establishes one bracket champion; otherwise avoid false claims.
  if (finalSlots.length!==1) return '';
  const finalMatch=state.matches.find(m=>m.id===finalSlots[0].match_id);
  if (!finalMatch) return '';
  const winnerId=isWalkover(finalMatch)
    ? finalMatch.walkover_winner_pair_id
    : isDone(finalMatch)&&finalMatch.score_a!==finalMatch.score_b
      ? (finalMatch.score_a>finalMatch.score_b?finalMatch.pair_a_id:finalMatch.pair_b_id)
      : null;
  const valid=winnerId&&(winnerId===finalMatch.pair_a_id||winnerId===finalMatch.pair_b_id);
  if (!valid) return `<div class="champion-panel champion-pending" aria-label="優勝ペア未確定"><div class="champion-kicker">🏆 優勝ペア：未確定</div><p class="champion-caption">決勝戦の結果が保存されると、ここに勝者を表示します。</p></div>`;
  const score=isWalkover(finalMatch)?'決勝：不戦勝':`決勝：${finalMatch.score_a} – ${finalMatch.score_b}`;
  return `<div class="champion-panel" aria-label="決勝結果から算出した優勝ペア"><div class="champion-kicker">🏆 CHAMPION · 優勝ペア</div><div class="champion-name">${esc(pairName(winnerId))}</div><div class="champion-result">${esc(score)}</div><p class="champion-caption">決勝戦の保存結果から自動表示しています。大会の正式な結果承認・確定を示すものではありません。</p></div>`;
}

 const ties=[...new Set(rows.map(r=>Number(r.rank)))].map(rank=>rows.filter(r=>Number(r.rank)===rank)).filter(block=>block.length>1);
 if(!ties.length){alert('同順位のペアがありません。');return}
 const sections=ties.map((block,i)=>`<div class="card"><b>自動計算 ${Number(block[0].rank)}位タイ（${block.length}ペア）</b><p class="prompt">各確定順位のペアを選択してください。別の同順位グループのペアは選べません。</p>${block.map((r,j)=>`<div style="margin:10px 0"><label>確定 ${Number(block[0].rank)+j}位</label><select class="field" data-tie-block="${i}" data-tie-index="${j}">${block.map((p,k)=>opt(p.pair_id,p.pair_name||pairName(p.pair_id),block[j].pair_id)).join('')}</select></div>`).join('')}</div>`).join('');
 modal(`<div class="row"><h2 style="margin:0">同順位を手動解決</h2><button class="btn secondary mini-btn" data-close>閉じる</button></div><p class="prompt">${esc(catName(g.cat))} / ${esc(g.group)}組 ／ 大会管理者のみ実行できます。</p>${sections}<label for="rankingReason">順位を決めた根拠・理由（必須）</label><textarea id="rankingReason" class="field" rows="3" placeholder="例：大会規定に従い直接対決の勝者を上位とした"></textarea><p class="prompt">この操作で順位承認と監査履歴を同時に保存します。</p><p class="empty-error hide" id="rankingMsg" role="alert"></p><button class="btn wide" id="saveRankingResolution">順位を確定する</button>`);
 $('saveRankingResolution').onclick=async()=>{
  const selections=[...$('overlay').querySelectorAll('[data-tie-block]')];
  const orders=ties.map((block,i)=>selections.filter(x=>Number(x.dataset.tieBlock)===i).map(x=>x.value));
  if(orders.some((order,i)=>new Set(order).size!==ties[i].length)){$('rankingMsg').textContent='同じペアが重複しています。各順位に異なるペアを指定してください。';$('rankingMsg').classList.remove('hide');return}
  const reason=$('rankingReason').value.trim();if(!reason){$('rankingMsg').textContent='調整理由を入力してください。';$('rankingMsg').classList.remove('hide');return}
  const tieByRank=new Map(ties.map((block,i)=>[Number(block[0].rank),orders[i]]));
  const ordered=[];for(const rank of [...new Set(rows.map(r=>Number(r.rank)))] ){ordered.push(...(tieByRank.get(rank)||rows.filter(r=>Number(r.rank)===rank).map(r=>r.pair_id)))}
  if(!confirm('選択した順序で順位を正式確定しますか？\n調整理由は監査履歴に記録されます。'))return;
  const b=$('saveRankingResolution');b.disabled=true;
  try{const {error}=await client.rpc('admin_resolve_group_ranking_ties',{p_category_id:g.cat,p_group_name:g.group,p_ordered_pair_ids:ordered,p_reason:reason});if(error)throw error;closeModal();await loadData();alert('同順位を解決し、順位を正式承認しました。')}catch(e){if($('rankingMsg')){$('rankingMsg').textContent='確定に失敗しました：'+e.message;$('rankingMsg').classList.remove('hide')}if(b.isConnected)b.disabled=false;await refreshRankings()}
 };
}
function pairs(){const ps=state.pairs.filter(p=>state.category==='all'||p.category_id===state.category).filter(p=>state.tournament==='all'||state.categories.find(c=>c.id===p.category_id)?.tournament_id===state.tournament);const selected=ps.find(p=>p.id===state.pair)||ps[0];return `${controls()}<h2>ペア別試合検索</h2><label>ペアを選択</label><select class="field" id="pairFilter">${ps.map(p=>opt(p.id,p.display_name,selected?.id)).join('')}</select>${selected?`<div class="card"><b>${esc(selected.display_name)}</b> <small class="muted">${esc(catName(selected.category_id))}</small></div><div class="grid">${visibleMatches().filter(m=>m.pair_a_id===selected.id||m.pair_b_id===selected.id).map(matchCard).join('')||'<div class="empty">試合がありません。</div>'}</div>`:'<div class="empty">ペアがありません。</div>'}`}
function render(){navbar();let top=`<div class="notice blue"><div class="row"><b>Supabase v10 共有データ</b><button class="btn secondary mini-btn" id="reload">更新</button></div><div class="auth-inline tabs-note">${state.auth?`<span>ログイン：${esc(state.auth.email||'')}</span><button class="btn secondary mini-btn" id="logout">ログアウト</button>`:`<span>閲覧モード</span><button class="btn secondary mini-btn" id="login">スタッフログイン</button>`}${state.auth&&!state.staff?'<span class="prompt">スタッフ権限の確認待ち／権限なし</span>':''}</div></div>`;let content=state.error?`<div class="empty-error">${esc(state.error)}</div>`:state.loading?'<div class="card">Supabaseからデータを取得中です…</div>':({home,matches,courts,bracket,ranking,pairs,manage})[state.tab]();$('screen').innerHTML=top+content+'<footer>v10開発プレビュー｜V9画面デザインを踏襲</footer>';$('reload').onclick=loadData;const login=$('login'),logout=$('logout');if(login)login.onclick=loginModal;if(logout)logout.onclick=signOut;document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.goto;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editScore(b.dataset.edit));document.querySelectorAll('[data-official-confirm]').forEach(b=>b.onclick=()=>confirmOfficial(b.dataset.officialConfirm));document.querySelectorAll('[data-official-revoke]').forEach(b=>b.onclick=()=>revokeOfficial(b.dataset.officialRevoke));document.querySelectorAll('[data-ranking-approve]').forEach(b=>b.onclick=()=>approveRanking(b.dataset.rankingApprove));document.querySelectorAll('[data-ranking-revoke]').forEach(b=>b.onclick=()=>revokeRanking(b.dataset.rankingRevoke));document.querySelectorAll('[data-ranking-resolve]').forEach(b=>b.onclick=()=>resolveRankingModal(b.dataset.rankingResolve));wireControls();const cf=$('createTournamentForm');if(cf)cf.onsubmit=createTournament;const cc=$('createCategoryForm');if(cc)cc.onsubmit=createCategory;const etf=$('eventTimeForm');if(etf)etf.onsubmit=saveEventTime;const ncf=$('numberedCourtsForm');if(ncf)ncf.onsubmit=addNumberedCourts;document.querySelectorAll('[data-save-capacity]').forEach(el=>el.onclick=()=>saveCapacityPlan(el.dataset.saveCapacity));document.querySelectorAll('[data-plan-pairs]').forEach(el=>el.onchange=()=>{editCapacityPlan(categoryForm.tournamentId,el.dataset.planPairs,'pairs',el.value);render()});document.querySelectorAll('[data-plan-group-size]').forEach(el=>el.onchange=()=>{editCapacityPlan(categoryForm.tournamentId,el.dataset.planGroupSize,'groupSize',el.value);render()});document.querySelectorAll('[data-plan-advance]').forEach(el=>el.onchange=()=>{editCapacityPlan(categoryForm.tournamentId,el.dataset.planAdvance,'advance',el.value);render()});document.querySelectorAll('[data-plan-final-format]').forEach(el=>el.onchange=()=>{editCapacityPlan(categoryForm.tournamentId,el.dataset.planFinalFormat,'finalFormat',el.value);recruitmentOptimization.result=null;render()});const rb=$('recruitmentBuffer');if(rb)rb.onchange=()=>{recruitmentOptimization.bufferMinutes=Number(rb.value);recruitmentOptimization.result=null;render()};const ob=$('optimizeRecruitment');if(ob)ob.onclick=optimizeRecruitmentClick;const ab=$('applyRecruitmentSuggestion');if(ab)ab.onclick=applyRecruitmentSuggestion;const qm=$('qualificationMinutes');if(qm)qm.onchange=()=>{planningSimulation.qualificationMinutes=Number(qm.value);render()};const ct=$('manageTournament');if(ct)ct.onchange=()=>{categoryForm.tournamentId=ct.value;categoryForm.selectedLevels=[1];categoryForm.displayOrder=0;render()};document.querySelectorAll('[data-category-level]').forEach(x=>x.onchange=()=>{const i=Number(x.dataset.categoryLevel);categoryForm.selectedLevels=x.checked?[...new Set([...categoryForm.selectedLevels,i])].sort((a,b)=>a-b):categoryForm.selectedLevels.filter(v=>v!==i);render()});const cd=$('categoryDivision');if(cd)cd.onchange=()=>{categoryForm.division=cd.value;render()};const co=$('categoryDisplayOrder');if(co)co.onchange=()=>{categoryForm.displayOrder=co.value;render()};let pf=$('pairFilter');if(pf)pf.onchange=()=>{state.pair=pf.value;render()}}
async function fetchAll(name,columns='*',order='id'){let out=[],from=0;for(;;){let q=client.from(name).select(columns).range(from,from+499);if(order)q=q.order(order,{ascending:true});let {data,error}=await q;if(error)throw Error(name+' : '+error.message);out.push(...(data||[]));if(!data||data.length<500)break;from+=500;if(from>=10000)throw Error(name+' : 10000行超のため取得を停止しました')}return out}
async function loadData(){if(!client){state.error='Supabaseに接続できません。公開用設定を確認してください。';render();return}state.loading=true;state.error='';render();try{let [t,c,s,p,m]=await Promise.all([fetchAll('tournaments'),fetchAll('categories'),fetchAll('competition_stages'),fetchAll('pairs'),fetchAll('matches')]);state.tournaments=t;state.categories=c;hydrateCapacityPlans(c);state.stages=s;state.pairs=p;state.matches=m;state.bracketSlots=[];state.bracketError='';state.officialResults=[];state.officialError='';state.officialLoaded=false;const officialResult=await client.rpc('get_public_category_final_results');if(officialResult.error){state.officialError=officialResult.error.message}else{state.officialResults=officialResult.data||[];state.officialLoaded=true}const slotResult=await client.rpc('get_public_knockout_bracket_slots');if(slotResult.error){state.bracketError=slotResult.error.message}else{state.bracketSlots=slotResult.data||[]}state.courtLoadError='';try{state.courts=await fetchAll('courts','id,name,tournament_id,court_type,is_active');}catch(courtError){state.courts=[];state.courtLoadError=courtError.message;}state.lastLoaded=new Date()}catch(e){state.error='データ取得に失敗しました：'+e.message}finally{state.loading=false;render();if(!state.error)await refreshRankings()}}
function closeModal(){ $('overlay').innerHTML='' }
function modal(inner){$('overlay').innerHTML=`<div class="modalback" id="modalback"><div class="modal">${inner}</div></div>`;$('modalback').onclick=e=>{if(e.target.id==='modalback')closeModal()};document.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal)}
function loginModal(){modal(`<div class="row"><h2 style="margin:0">スタッフログイン</h2><button class="btn secondary mini-btn" data-close>閉じる</button></div><label>メールアドレス</label><input class="field" id="email" type="email" autocomplete="username"><label>パスワード</label><input class="field" id="password" type="password" autocomplete="current-password"><p class="prompt">V10テスト画面と同じメールアドレス・パスワードを使用します。</p><p id="authMsg" class="prompt" role="status"></p><button class="btn wide" id="signIn">ログイン</button>`);$('signIn').onclick=async()=>{let b=$('signIn');b.disabled=true;try{let {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error)throw error;closeModal();await refreshAuth();await loadData()}catch(e){$('authMsg').textContent='ログインできません：'+e.message}finally{if(b.isConnected)b.disabled=false}}}
async function refreshAuth(){
 if(!client)return;
 const {data,error}=await client.auth.getUser();const user=error?null:data.user||null;
 state.auth=user;state.staff=false;state.staffError='';state.systemAdmin=false;state.systemAdminLoaded=false;state.systemAdminError='';state.tournamentAdminIds=[];state.tournamentAdminLoaded=false;state.tournamentAdminError='';
 if(user){
  const [roleResult,adminResult,staffResult]=await Promise.all([
   client.from('staff_users').select('user_id').eq('user_id',user.id).eq('is_active',true).maybeSingle(),
   client.rpc('get_my_system_admin_status'),
   client.from('tournament_staff').select('tournament_id,role').eq('user_id',user.id).eq('role','admin')
  ]);
  if(state.auth?.id!==user.id)return;
  state.staff=!roleResult.error&&!!roleResult.data;state.staffError=roleResult.error?.message||'';
  state.systemAdmin=!adminResult.error&&adminResult.data===true;state.systemAdminLoaded=!adminResult.error;state.systemAdminError=adminResult.error?.message||'';
  state.tournamentAdminError=staffResult.error?.message||'';
  state.tournamentAdminLoaded=!staffResult.error;
  state.tournamentAdminIds=state.staff&&!staffResult.error?(staffResult.data||[]).map(x=>x.tournament_id):[];
 }
 if(state.tab==='manage'&&!canOpenManage())state.tab='home';
 state.qualificationLocksLoaded=false;state.qualificationLocks=[];render();
}
async function signOut(){if(!client)return;let {error}=await client.auth.signOut();if(error){alert(error.message);return}state.auth=null;state.staff=false;state.systemAdmin=false;state.systemAdminLoaded=false;state.systemAdminError='';state.tournamentAdminIds=[];state.tournamentAdminLoaded=false;state.tournamentAdminError='';if(state.tab==='manage')state.tab='home';render();await loadData()}
async function confirmOfficial(categoryId){
 if(!state.staff||officialLocked(categoryId))return;
 if(!confirm('このカテゴリーの優勝・準優勝を正式確定しますか？\n確定後はスコア・対戦枠を編集できなくなります。'))return;
 try{const {error}=await client.rpc('staff_confirm_category_final_result',{p_category_id:categoryId});if(error)throw error;await loadData();alert('正式結果を確定しました。');}catch(e){alert('正式確定できませんでした：'+e.message+'\n最新データに更新してください。');await loadData()}
}
async function revokeOfficial(categoryId){
 if(!state.staff||!state.officialLoaded||!officialFor(categoryId)?.is_admin)return;
 const reason=prompt('正式確定を取り消す理由を入力してください（必須）');if(reason===null)return;if(!reason.trim()){alert('取消理由が必要です。');return}
 if(!confirm('正式確定を取り消し、結果の編集を再開しますか？'))return;
 try{const {error}=await client.rpc('staff_revoke_category_final_result',{p_category_id:categoryId,p_reason:reason.trim()});if(error)throw error;await loadData();alert('正式確定を取り消しました。');}catch(e){alert('正式確定を取り消せませんでした：'+e.message);await loadData()}
}
function editScore(id){if(!state.staff){alert('スタッフ認証が必要です。');return}const m=state.matches.find(x=>x.id===id);if(!m)return;if(officialLocked(m.category_id)){alert('正式確定済み、または正式結果の状態を取得できません。更新してください。');return}if(preliminaryEditLocked(m)){alert(state.qualificationLocks.includes(m.category_id)?'決勝進出者が確定済みのため、予選結果を編集できません。':'決勝進出者の確定状態を確認できないため、予選結果の編集を停止しています。更新してください。');return}const unresolved=!m.pair_a_id||!m.pair_b_id;const walk=isWalkover(m);modal(`<div class="row"><h2 style="margin:0">試合結果・不戦勝</h2><button class="btn secondary mini-btn" data-close>閉じる</button></div><p class="prompt">${esc(catName(m.category_id))} / ${esc(stageLabel(m))}</p><p><b>${esc(pairName(m.pair_a_id))}</b> vs <b>${esc(pairName(m.pair_b_id))}</b></p><p class="prompt">現在：${walk?'不戦勝（'+esc(winnerName(m))+'）':isDone(m)?m.score_a+' - '+m.score_b:esc(m.status)}</p>${unresolved?'<div class="notice">対戦相手が未確定のため結果を保存できません。</div>':''}<div class="scoreinputs"><div><label>${esc(pairName(m.pair_a_id))}</label><input class="field" id="scoreA" type="number" inputmode="numeric" min="0" max="99" value="${m.score_a??''}"></div><div><label>${esc(pairName(m.pair_b_id))}</label><input class="field" id="scoreB" type="number" inputmode="numeric" min="0" max="99" value="${m.score_b??''}"></div></div><p class="prompt">最終得点を入力。後続の試合開始後は勝者変更できません。</p><p id="editMsg" class="empty-error hide" role="alert"></p><div class="modal-actions"><button class="btn" id="saveScore" ${unresolved||walk?'disabled':''}>結果を保存</button><button class="btn secondary" id="confirmWalkover" ${unresolved||isDone(m)||m.status==='playing'||m.status==='cancelled'?'disabled':''}>不戦勝を確定・訂正</button>${walk?'<button class="btn secondary" id="revokeWalkover">不戦勝を取り消す</button>':''}${isDone(m)?'<button class="btn secondary" id="revokeScore">試合結果を取り消す</button>':''}</div>`);
const act=async (fn,args,msg)=>{const buttons=[...$('overlay').querySelectorAll('button')];buttons.forEach(x=>x.disabled=true);try{if(!confirm(msg)){buttons.forEach(x=>x.disabled=false);return}let {error}=await client.rpc(fn,args);if(error)throw error;closeModal();await loadData();alert('保存しました。最新データを取得しました。')}catch(e){let el=$('editMsg');if(el){el.textContent='操作できませんでした：'+e.message+'。更新してからやり直してください。';el.classList.remove('hide')}buttons.forEach(x=>x.disabled=false)}};
$('saveScore').onclick=()=>{const aa=$('scoreA').value.trim(),bb=$('scoreB').value.trim(),a=Number(aa),b=Number(bb);if(!aa||!bb||!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a>99||b>99||a===b){let e=$('editMsg');e.textContent='0〜99の異なる整数を入力してください。';e.classList.remove('hide');return}act('staff_save_score',{p_match_id:m.id,p_score_a:a,p_score_b:b,p_expected_updated_at:m.updated_at},'スコアを '+a+' - '+b+' で保存しますか？')};
if($('confirmWalkover'))$('confirmWalkover').onclick=()=>{let value=prompt('不戦勝の勝者を選んでください。\nA: '+pairName(m.pair_a_id)+'\nB: '+pairName(m.pair_b_id)+'\nA または B を入力');if(value===null)return;value=value.trim().toUpperCase();if(value!=='A'&&value!=='B'){alert('A または B を入力してください');return}const reason=prompt('不戦勝の理由を入力してください（必須）');if(!reason?.trim()){alert('理由が必要です');return}act(stageFor(m)?.stage_type==='preliminary'?'staff_confirm_preliminary_walkover':'staff_confirm_walkover',{p_match_id:m.id,p_winner_pair_id:value==='A'?m.pair_a_id:m.pair_b_id,p_expected_updated_at:m.updated_at,p_reason:reason.trim()},'指定した勝者で不戦勝を確定しますか？')};
if($('revokeWalkover'))$('revokeWalkover').onclick=()=>{const reason=prompt('不戦勝取消の理由を入力してください（必須）');if(!reason?.trim()){alert('理由が必要です');return}act(stageFor(m)?.stage_type==='preliminary'?'staff_revoke_preliminary_walkover':'staff_revoke_walkover',{p_match_id:m.id,p_expected_updated_at:m.updated_at,p_reason:reason.trim()},'不戦勝を取り消しますか？')};
if($('revokeScore'))$('revokeScore').onclick=()=>{const reason=prompt('試合結果取消の理由を入力してください（必須）\n※後続の試合が開始・終了している場合、取消は拒否されます。');if(reason===null)return;if(!reason.trim()){alert('取消理由が必要です。');return}act('staff_revoke_score',{p_match_id:m.id,p_expected_updated_at:m.updated_at,p_reason:reason.trim()},'スコア '+m.score_a+' - '+m.score_b+' を取り消し、試合を未実施に戻しますか？\n※この操作は監査履歴に記録されます。')};
}
if(client){client.auth.onAuthStateChange(()=>setTimeout(async()=>{await refreshAuth();if(!state.loading&&!state.error)await refreshRankings()},0));refreshAuth().then(loadData)}else render();
</script></body></html>
