/* Step 20: score transcription filters */
.match-search-controls{margin:14px 0 16px}
.match-search-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.match-filter-check{display:flex;align-items:center;gap:9px;font-size:14px;color:#264a5a;font-weight:650;margin:10px 0}

/* tournament-wide match number */

/* bracket visualization */
.bracket-scroller{overflow:auto;max-height:75vh;border:1px solid #dbe4e9;border-radius:14px;background:#fbfdfe;overscroll-behavior:contain}

.bracket-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:#536b77;margin:8px 0 12px}
.bracket-stage{margin-bottom:24px}

/* Step 427: keep iOS Safari native date/time controls within the settings card. */
.tournament-settings-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); min-width:0; width:100%; }
.tournament-settings-fields > div { min-width:0; max-width:100%; width:100%; }
.tournament-settings-fields .field { display:block; box-sizing:border-box; width:100%; min-width:0; max-width:100%; }
.tournament-settings-fields input[type="date"],
.tournament-settings-fields input[type="time"] { -webkit-appearance:none; appearance:none; max-inline-size:100%; min-inline-size:0; }

 .tournament-settings-fields { grid-template-columns:minmax(0,1fr); }
 /* A small fixed gutter accommodates Safari's intrinsic native-control sizing. */
 .tournament-settings-fields input[type="date"],
 .tournament-settings-fields input[type="time"] { width:calc(100% - 12px); max-width:calc(100% - 12px); margin-right:12px; }
}

/* Step 428: scoped form consistency without replacing native date/time pickers. */
@media screen {
  #tournamentSettingsForm { min-width:0; }
  #tournamentSettingsForm > div, #tournamentSettingsForm .tournament-settings-fields,
  #tournamentSettingsForm .tournament-settings-fields > div { min-width:0; max-width:100%; }
  #tournamentSettingsForm input.field {
    display:block;
    box-sizing:border-box;
    inline-size:100%;
    min-inline-size:0;
    max-inline-size:100%;
    min-height:52px;
    height:52px;
    padding:10px 14px;
    margin:0;
    border:1px solid #cedde3;
    border-radius:10px;
    background-color:#fff;
    color:#182f3c;
    font-size:16px;
    line-height:1.35;
    box-shadow:none;
  }
  /* Keep native OS controls for date and time; constrain their intrinsic width. */
  #tournamentSettingsForm input.field[type="date"],
  #tournamentSettingsForm input.field[type="time"] {
    -webkit-appearance:auto;
    appearance:auto;
    max-inline-size:100%;
    overflow:hidden;
  }
  #tournamentSettingsForm input.field:disabled {
    background-color:#f7f9fa;
    color:#617380;
    border-color:#dce5ea;
    opacity:1;
    -webkit-text-fill-color:#617380;
  }
  #tournamentSettingsForm input.field:enabled:focus-visible {
    outline:2px solid #2e8277;
    outline-offset:1px;
  }
  #tournamentSettingsForm .tournament-settings-fields {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
  }
  #tournamentSettingsForm label { margin-bottom:7px; }
}
@media screen and (max-width:759px) {
  #tournamentSettingsForm .tournament-settings-fields { grid-template-columns:minmax(0,1fr); }
  #tournamentSettingsForm input.field[type="date"],
  #tournamentSettingsForm input.field[type="time"] {
    inline-size:100%;
    max-inline-size:100%;

  }
}

const state={matchNumbers:{},matchNumberError:'',tab:'public_home',loading:false,error:'',auth:null,staff:false,staffError:'',systemAdmin:false,systemAdminLoaded:false,systemAdminError:'',tournamentAdminIds:[],tournamentStaffIds:[],tournamentAdminLoaded:false,tournamentAdminError:'',tournaments:[],categories:[],stages:[],pairs:[],matches:[],courts:[],category:'all',tournament:'all',pair:'',group:'',rankings:[],approved:[],rankingError:'',bracketError:'',bracketSlots:[],officialResults:[],officialError:"",officialLoaded:false,rankingRows:{},rankingLoadErrors:{},rankingLoading:false,approvedLoaded:false,approvedError:'',qualificationLocks:[],qualificationLocksLoaded:false,qualificationLocksError:'',courtLoadError:'',lastLoaded:null};

// Planning is local until an administrator explicitly saves one category through the RPC.
const capacityPlans={};
const capacityPlanDirty=new Set();
const capacityPlanSaving=new Set();
const capacityPlanMessages={};
const planKey=(t,c)=>`${t}:${c}`;
function capacityPlanMatchesSaved(t,c){
 const category=state.categories.find(x=>x.id===c&&x.tournament_id===t);
 if(!category)return false;
 const saved=[category.planned_pairs,category.preliminary_group_max_pairs,category.qualifiers_per_group,category.final_format];
 if(saved.some(v=>v===null||v===undefined))return false;
 const plan=getCapacityPlan(t,c);
 return Number(plan.pairs)===Number(saved[0])
  &&Number(plan.groupSize)===Number(saved[1])
  &&Number(plan.advance)===Number(saved[2])
  &&plan.finalFormat===saved[3];
}
function editCapacityPlan(t,c,field,value){

 const key=planKey(t,c);
 if(capacityPlanMatchesSaved(t,c))capacityPlanDirty.delete(key);
 else capacityPlanDirty.add(key);

}
function hydrateCapacityPlans(categories){
 for(const c of categories){
  const key=planKey(c.tournament_id,c.id);
  if(capacityPlanDirty.has(key)||capacityPlanSaving.has(key))continue;
  if(!capacityPlans[c.tournament_id])capacityPlans[c.tournament_id]={};

  capacityPlans[c.tournament_id][c.id]=saved.every(v=>v!==null&&v!==undefined)
   ?{pairs:String(saved[0]),groupSize:String(saved[1]),advance:String(saved[2]),finalFormat:String(saved[3])}
   :{pairs:String(PLAN_DEFAULT_PAIRS),advance:'2',groupSize:'4',finalFormat:'knockout'};

}
const PLAN_DEFAULT_PAIRS=16;
function planGroupings(pairCount,advancePerGroup,maxGroupSize,finalFormat='knockout'){
 const n=Number(pairCount),advance=Number(advancePerGroup),maxSize=Number(maxGroupSize);
 if(!Number.isInteger(n)||n<3||n>64||![1,2].includes(advance)||![3,4,5,6].includes(maxSize))return null;
 const groupCount=Math.ceil(n/maxSize),base=Math.floor(n/groupCount),remainder=n%groupCount;

 if(sizes.some(size=>size<3||size>maxSize))return null;
 const qualifiers=groupCount*advance;
 if(groupCount>1&&![2,3,4].includes(qualifiers))return null;
 const resolvedFormat=groupCount>1&&qualifiers===3?'round_robin':'knockout';
 const preliminary=sizes.reduce((sum,size)=>sum+size*(size-1)/2,0);
 const knockout=groupCount===1?0:qualifiers===2?1:qualifiers===3?3:4;
 return {sizes,preliminary,qualifiers,knockout,finalFormat:resolvedFormat,total:preliminary+knockout};
}
function getCapacityPlan(tournamentId,categoryId){
 if(!capacityPlans[tournamentId])capacityPlans[tournamentId]={};

}
// Scenario calculation is local-only. Display the latest of four hypothetical outcomes;
// never claim all real winners or double-entries have been validated.
const EVENT_PREP_MINUTES=90; // setup 30 + reception/warmup 45 + opening 15
const EVENT_CLOSE_MINUTES=60; // closing ceremony and cleanup
const EVENT_RESERVED_MINUTES=EVENT_PREP_MINUTES+EVENT_CLOSE_MINUTES;
const planningSimulation={qualificationMinutes:15};

// STEP 171: final-stage format selectable per category; local-only provisional search. Never writes to Supabase.
const recruitmentOptimization={bufferMinutes:15,result:null,tournamentId:null,signature:null,busy:false};
function recruitmentSignature(t,categories,courts){return JSON.stringify({id:t?.id,start:t?.start_time,end:t?.end_time,match:t?.match_minutes,rest:t?.minimum_rest_minutes,consecutive:t?.max_consecutive_matches,courts,qualification:planningSimulation.qualificationMinutes,buffer:recruitmentOptimization.bufferMinutes,categories:categories.map(c=>{const p=getCapacityPlan(t.id,c.id);return [c.id,p.groupSize,p.advance,p.finalFormat||'knockout']})});}
function recruitmentCandidateCounts(groupMax,advance,finalFormat){
 const counts=[4,6,8,10,12,16,20,24,32,40,48,56,64];
 return counts.map(n=>{const r=planGroupings(n,advance,groupMax,finalFormat);return r?{pairs:n,total:r.total,groupSizes:r.sizes}:null}).filter(Boolean);
}
function calculateRecruitmentSuggestion(t,categories,courtCount,buffer){
 if(!t||!categories.length||categories.length>8)throw Error('対象カテゴリー数は1〜8件で設定してください。');
 const clock=v=>{const v0=String(v||'').slice(0,5);if(!/^\d\d:\d\d$/.test(v0))throw Error('開催時刻が未設定です');const [h,m]=v0.split(':').map(Number);if(h>23||m>59)throw Error('開催時刻が不正です');return h*60+m};
 const start=clock(t.start_time),end=clock(t.end_time),match=Number(t.match_minutes),rest=Number(t.minimum_rest_minutes??0),consecutive=Number(t.max_consecutive_matches??2);
 if(start>=end||!Number.isInteger(match)||match<1||!Number.isInteger(courtCount)||courtCount<1||!Number.isInteger(buffer)||buffer<0||end-EVENT_CLOSE_MINUTES-buffer<=start+EVENT_PREP_MINUTES)throw Error('開催時間・コート・余裕時間を見直してください。');
 const theoretical=courtCount*Math.floor(Math.max(0,end-start-EVENT_RESERVED_MINUTES-buffer)/match);
 const all=categories.map(c=>{const p=getCapacityPlan(t.id,c.id);return recruitmentCandidateCounts(Number(p.groupSize),Number(p.advance),p.finalFormat||'knockout')});
 if(all.some(x=>!x.length))return {status:'no_candidates',trials:0};
 // Beam search bounds both runtime and memory as category count increases.
 let beam=[{items:[],matches:0,pairs:0,low:0,high:0}];
 const width=1600,maxGap=8;
 for(let i=0;i<categories.length;i++){
  const next=[];
  for(const state0 of beam)for(const item of all[i]){
   const lo=i?Math.min(state0.low,item.pairs):item.pairs,hi=i?Math.max(state0.high,item.pairs):item.pairs;
   if(hi-lo>maxGap||state0.matches+item.total>theoretical)continue;
   next.push({items:[...state0.items,item],matches:state0.matches+item.total,pairs:state0.pairs+item.pairs,low:lo,high:hi});
  }
  next.sort((a,b)=>b.pairs-a.pairs||(a.high-a.low)-(b.high-b.low)||a.matches-b.matches);
  beam=next.slice(0,width);
  if(!beam.length)return {status:'no_candidates',trials:0};
 }
 let trials=0;
 const effectiveEnd=String(Math.floor((end-buffer)/60)).padStart(2,'0')+':'+String((end-buffer)%60).padStart(2,'0');
 for(const suggestion of beam.slice(0,120)){
  trials++;
  const plans=categories.map((c,i)=>{const p=getCapacityPlan(t.id,c.id);return {name:c.name,pairs:suggestion.items[i].pairs,groupMax:Number(p.groupSize),advance:Number(p.advance),finalFormat:p.finalFormat||'knockout'}});
  const r=v10ScheduleEngine.simulate({start:minuteClock(start+EVENT_PREP_MINUTES),end:effectiveEnd,reservedMinutes:EVENT_CLOSE_MINUTES,matchMinutes:match,restMinutes:rest,maxConsecutive:consecutive,courts:courtCount,qualificationMinutes:planningSimulation.qualificationMinutes,categories:plans,scenarios:4});
  if(r.status==='fits_all_tested_scenarios'){
   const worst=Math.max(...r.runs.map(v=>v.finishMinute));
   const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
   return {status:'provisional_fit',suggestions:categories.map((c,i)=>({id:c.id,name:c.name,...suggestion.items[i]})),totalPairs:suggestion.pairs,totalMatches:suggestion.matches,theoretical,finish:fmt(worst),deadline:fmt(end-EVENT_CLOSE_MINUTES-buffer),remaining:end-EVENT_CLOSE_MINUTES-buffer-worst,trials};
  }
 }
 return {status:'no_fit_found',trials,examined:beam.length};
}
function recruitmentOptimizationSection(t,categories,courts,availableSlots){

 const ready=!windowsActive&&availableSlots!==null&&courts>0&&t.start_time&&t.end_time;
 const report=!result?'':result.status==='provisional_fit'?`<div class="notice blue">仮の勝敗4パターンで配置できた暫定案です。最適解の保証はありません。</div><div class="tablebox"><table class="tbl"><thead><tr><th>カテゴリー</th><th>提案募集ペア数</th><th>予選構成</th><th>必要試合数</th></tr></thead><tbody>${result.suggestions.map(x=>`<tr><td>${esc(x.name)}</td><td><b>${x.pairs}ペア</b></td><td>${esc(x.groupSizes.join('・'))}</td><td>${x.total}試合</td></tr>`).join('')}</tbody></table></div><div class="metrics"><div class="metric"><small>合計募集数</small><strong>${result.totalPairs}ペア</strong></div><div class="metric"><small>必要試合数</small><strong>${result.totalMatches}試合</strong></div><div class="metric"><small>仮の終了時刻</small><strong>${esc(result.finish)}</strong></div></div><p class="prompt">余裕時間を含めた終了期限：${esc(result.deadline)} ／ 残り：${result.remaining}分 ／ 検証候補：${result.trials}件</p><button class="btn wide" id="applyRecruitmentSuggestion">この提案をシミュレーションへ反映</button>`:`<div class="notice">${result.status==='no_candidates'?'予選グループ・理論収容力に収まる募集枠候補がありません。':'探索した候補では時間内の仮配置を確認できませんでした。開催不可能という意味ではありません。'} （検証：${result.trials}件）</div>`;

}
function optimizeRecruitmentClick(){
 if(recruitmentOptimization.busy)return;
 if(state.categories.some(c=>c.tournament_id===categoryForm.tournamentId&&(()=>{const d=getWindowDraft(categoryForm.tournamentId,c);return !!(d.start||d.end);})())){alert('カテゴリー別開催枠が設定されているため、旧方式の募集枠自動提案は使用できません。');return;}

}
function applyRecruitmentSuggestion(){

 const count=state.courts.filter(c=>c.tournament_id===t?.id&&c.is_active&&c.court_type==='official').length;
 if(!t||!result||result.status!=='provisional_fit'||recruitmentOptimization.tournamentId!==t.id||recruitmentOptimization.signature!==recruitmentSignature(t,cats.sort((a,b)=>a.display_order-b.display_order||a.name.localeCompare(b.name,'ja')),count))return;

async function saveCapacityPlan(categoryId){
 const tid=categoryForm.tournamentId,key=planKey(tid,categoryId);
 const tournament=state.tournaments.find(t=>t.id===tid);
 const category=state.categories.find(c=>c.id===categoryId&&c.tournament_id===tid);
 if(!client||!category||!['draft','published'].includes(tournament?.status)||!canManageCategories()||!state.tournamentAdminIds.includes(tid)||capacityPlanSaving.has(key))return;
 const published=tournament.status==='published';
 const plan=getCapacityPlan(tid,categoryId);
 const candidate=planGroupings(plan.pairs,plan.advance,plan.groupSize);
 const values={pairs:Number(plan.pairs),groupSize:Number(plan.groupSize),advance:Number(plan.advance),finalFormat:published?category.final_format:(candidate?.finalFormat||plan.finalFormat)};
 if(!Number.isInteger(values.pairs)||values.pairs<3||values.pairs>64||(!published&&!candidate)){
  capacityPlanMessages[key]={ok:false,text:'募集上限は3〜64ペアの整数で指定してください。下書きの場合は組分け条件も確認してください。'};render();return;
 }
 if(published&&(values.groupSize!==Number(category.preliminary_group_max_pairs)||values.advance!==Number(category.qualifiers_per_group)||values.finalFormat!==category.final_format)){
  capacityPlanMessages[key]={ok:false,text:'公開後は募集上限以外の設定を変更できません。「更新」でDB値を確認してください。'};render();return;
 }
 if(!confirm(published?`「${category.name}」の募集上限を ${category.planned_pairs} → ${values.pairs} ペアに変更しますか？\n登録ペア・予選組分け・対戦表・時間割は変更しません。`: `「${category.name}」の募集枠を保存しますか？\n募集 ${values.pairs}ペア／1組最大 ${values.groupSize}ペア／各組上位 ${values.advance}ペア／決勝 ${values.finalFormat==='knockout'?'トーナメント':'総当たり'}\nこのカテゴリーのみ保存します。`))return;
 capacityPlanSaving.add(key);delete capacityPlanMessages[key];render();
 try{
  if(published){
   // Fail closed on stale tournament/category data and capacity below current participants.
   const [freshTournament,freshCategory,freshPairs]=await Promise.all([
    client.from('tournaments').select('id,status').eq('id',tid).single(),
    client.from('categories').select('id,tournament_id,planned_pairs,preliminary_group_max_pairs,qualifiers_per_group,final_format').eq('id',categoryId).single(),
    client.from('pairs').select('id').eq('category_id',categoryId).eq('participation_status','active')
   ]);
   if(freshTournament.error||freshCategory.error||freshPairs.error||!freshTournament.data||!freshCategory.data||!freshPairs.data)throw Error('最新の大会・カテゴリー・参加ペアを確認できません。');
   const db=freshCategory.data;
   if(freshTournament.data.status!=='published'||db.tournament_id!==tid||db.planned_pairs!==category.planned_pairs||db.preliminary_group_max_pairs!==category.preliminary_group_max_pairs||db.qualifiers_per_group!==category.qualifiers_per_group||db.final_format!==category.final_format)throw Error('公開状態または募集設定が変更されました。画面を更新してください。');

  }
  const {error}=await client.rpc('admin_save_category_recruitment_plan',{p_category_id:categoryId,p_planned_pairs:values.pairs,p_group_max_pairs:values.groupSize,p_qualifiers_per_group:values.advance,p_final_format:values.finalFormat});
  if(error)throw error;
  const {data,error:verifyError}=await client.from('categories').select('id,tournament_id,planned_pairs,preliminary_group_max_pairs,qualifiers_per_group,final_format').eq('id',categoryId).single();
  if(verifyError||!data||data.tournament_id!==tid||data.planned_pairs!==values.pairs||data.preliminary_group_max_pairs!==values.groupSize||data.qualifiers_per_group!==values.advance||data.final_format!==values.finalFormat)throw Error('RPC実行後のDB照合ができませんでした');
  Object.assign(category,data);
  if(capacityPlanMatchesSaved(tid,categoryId))capacityPlanDirty.delete(key);
  else capacityPlanDirty.add(key);
  capacityPlanMessages[key]={ok:true,text:published?'募集上限のみ保存済み。DBの4項目を再取得して照合しました。対戦表・時間割は変更していません。':'保存済み：Supabaseから4項目を再取得して照合しました。'};
 }catch(e){capacityPlanMessages[key]={ok:false,text:'保存結果を確認できませんでした：'+e.message+'。再保存の前に「更新」でDBの値を確認してください。'};}

}

// STEP 21-8: category-specific windows and flexible shared-court preview.
// Local-only greedy simulation. It is not a proof of feasibility and never writes matches.
const scheduleWindowDrafts={};
const scheduleWindowDirty=new Set();
const scheduleWindowBusy=new Set();
const scheduleWindowMessages={};
const windowKey=(t,c)=>`${t}:${c}`;
function scheduleWindowValues(c){return {start:c.schedule_start_time?.slice(0,5)||'',end:c.schedule_end_time?.slice(0,5)||'',preferred:c.preferred_courts==null?'':String(c.preferred_courts),max:c.max_courts==null?'':String(c.max_courts)};}
function getWindowDraft(t,c){const key=windowKey(t,c.id);return scheduleWindowDrafts[key]||(scheduleWindowDrafts[key]=scheduleWindowValues(c));}
function hydrateScheduleWindows(categories){for(const c of categories){const key=windowKey(c.tournament_id,c.id);if(!scheduleWindowDirty.has(key)&&!scheduleWindowBusy.has(key))scheduleWindowDrafts[key]=scheduleWindowValues(c);}}
function editScheduleWindow(t,c,f,v){const key=windowKey(t,c);const cat=state.categories.find(x=>x.id===c&&x.tournament_id===t);if(!cat)return;getWindowDraft(t,cat)[f]=v;const now=getWindowDraft(t,cat),saved=scheduleWindowValues(cat);if(Object.keys(now).every(k=>now[k]===saved[k]))scheduleWindowDirty.delete(key);else scheduleWindowDirty.add(key);delete scheduleWindowMessages[key];}

const v10ScheduleEngine=(()=>{

// STEP 161: recruitment-stage scenario simulator. Pure JavaScript; no DB writes.
const distribute=(n,maxSize)=>{const groups=Math.ceil(n/maxSize),base=Math.floor(n/groups),rem=n%groups;const sizes=Array.from({length:groups},(_,i)=>base+(i<rem?1:0));return sizes.every(v=>v>=3&&v<=maxSize)?sizes:null;};
const choose2=n=>n*(n-1)/2;
const time=v=>{if(!/^\d\d:\d\d$/.test(v))throw Error('invalid HH:MM');const [h,m]=v.split(':').map(Number);if(h>23||m>59)throw Error('invalid clock');return h*60+m;};
const fmt=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const power2=n=>2**Math.ceil(Math.log2(n));
function buildCategory(c,ci,scenario){
 const sizes=distribute(c.pairs,c.groupMax);
 if(!sizes)return {error:'3ペア以上で均等配分できません',category:c.name};
 const advance=c.advance??2;
 if(!Number.isInteger(advance)||advance<1||sizes.some(x=>advance>x))throw Error('invalid advance');
 const prelim=[],qualifiers=[];
 sizes.forEach((size,gi)=>{
  const ids=Array.from({length:size},(_,i)=>`C${ci}-G${gi}-P${i}`);
  for(let i=0;i<size;i++)for(let j=i+1;j<size;j++)prelim.push({id:`P-${ci}-${gi}-${i}-${j}`,phase:'preliminary',category:c.name,round:0,group:gi+1,pairs:[ids[i],ids[j]]});
  // Each outcome scenario picks hypothetical qualifiers from this group.
  const rotated=ids.map((_,i)=>ids[(i+(scenario%size))%size]);
  qualifiers.push(...rotated.slice(0,advance));
 });
 // Provisional final matches, independent of the database bracket.
 // One preliminary group has no final regardless of final format.
 const finalFormat=c.finalFormat||'knockout';
 if(!['knockout','round_robin'].includes(finalFormat))throw Error('invalid final format');
 const knockouts=[];let participants=sizes.length===1?[]:qualifiers.slice(),round=1;
 let semifinalLosers=[];
 if(finalFormat==='round_robin'){
  for(let i=0;i<participants.length;i++)for(let j=i+1;j<participants.length;j++)knockouts.push({id:`R-${ci}-${i}-${j}`,phase:'knockout',category:c.name,round:1,pairs:[participants[i],participants[j]]});
 }else if(participants.length>=2){
  const bracketSlots=power2(participants.length);
  const byeCount=bracketSlots-participants.length;
  // The fixed BYE seeds advance without creating a scheduled match.
  const byeSeeds=participants.slice(0,byeCount),roundOne=participants.slice(byeCount);
  let next=byeSeeds;
  for(let i=0;i<roundOne.length;i+=2){
   const pair=[roundOne[i],roundOne[i+1]];
   knockouts.push({id:`K-${ci}-${round}-${i/2}`,phase:'knockout',category:c.name,round,pairs:pair});
   next.push(pair[scenario%2]);
   if(roundOne.length===4)semifinalLosers.push(pair[1-(scenario%2)]);
  }
  participants=next;round++;
  while(participants.length>1){
   const winners=[];
   if(participants.length===4)semifinalLosers=[];

const groupingPreview={mode:'actual',categoryId:'',groupCount:'',busy:false,message:'',success:false,customOrder:[],orderKey:''};
function balancedGroupOptions(n,max){
  if(!Number.isInteger(n)||n<3||!Number.isInteger(max)||max<3||max>6)return [];
  const out=[];
  for(let k=1;k<=Math.floor(n/3);k++){
    const base=Math.floor(n/k),extra=n%k;
    const sizes=Array.from({length:k},(_,i)=>base+(i<extra?1:0));
    if(sizes.every(v=>v>=3&&v<=max))out.push({count:k,sizes});
  }
  return out;
}
function groupLabel(i){
  if(i<26)return String.fromCharCode(65+i);
  return String.fromCharCode(64+Math.floor(i/26))+String.fromCharCode(65+i%26);

function swapGroupingPreview(){

 if(!a||!b||a===b){groupingPreview.message='異なる2ペアを選んでください。';render();return;}

 if(!selected||!groupSaveEligible(state.tournaments.find(t=>t.id===categoryForm.tournamentId),cat,participants,selected))return;

 if(groupOf(ia)===groupOf(ib)){groupingPreview.message='同じ組のペアは入れ替え対象にできません。';render();return;}
 [order[ia],order[ib]]=[order[ib],order[ia]];

}
function groupingAssignments(participants,selected){
  if(!selected)return [];

  if(groupingPreview.orderKey===key&&groupingPreview.customOrder.length===participants.length){
    const byId=new Map(participants.map(p=>[p.id,p]));
    if(new Set(groupingPreview.customOrder).size===participants.length&&groupingPreview.customOrder.every(id=>byId.has(id)))participants=groupingPreview.customOrder.map(id=>byId.get(id));
  }

  return selected.sizes.flatMap((size,i)=>{

  if(state.matches.some(m=>m.category_id===cat.id)||state.approved.some(a=>a.category_id===cat.id)||state.qualificationLocks.includes(cat.id)||state.officialResults.some(r=>r.category_id===cat.id&&r.status!=='unconfirmed')||state.bracketSlots.some(s=>state.stages.some(st=>st.id===s.stage_id&&st.category_id===cat.id)))return false;
  if(state.pairs.some(p=>p.category_id===cat.id&&p.group_name!==null&&p.group_name!==undefined))return false;

      .eq('category_id',cat.id);
    if(readError||!latest)throw Error('保存前のペア再取得に失敗しました：'+(readError?.message||'データなし'));
    if(latest.some(p=>p.group_name!=null))throw Error('既に組分けが保存されています。更新して確認してください。');
    const fresh=latest.filter(p=>p.participation_status==='active').sort((a,b)=>a.display_name.localeCompare(b.display_name,'ja')||a.id.localeCompare(b.id));
    if(fresh.length!==participants.length||fresh.some((p,i)=>p.id!==participants[i].id||p.display_name!==participants[i].display_name))throw Error('登録ペアがプレビュー時から変更されています。更新して組分けを確認してください。');
    if(categoryForm.tournamentId!==tid||groupingPreview.categoryId!==cat.id||groupingPreview.mode!=='actual'||groupingPreview.groupCount!==String(choice.count)||groupingOrderKey(fresh,choice)!==groupingOrderKey(participants,choice))throw Error('画面の選択が変わりました。保存を中止しました。');
    const {data:saved,error:rpcError}=await client.rpc('admin_save_preliminary_groups',{p_category_id:cat.id,p_assignments:assignments});
    if(rpcError)throw Error(rpcError.message);
    if(Number(saved)!==assignments.length)throw Error('RPCの保存件数が一致しません。');
    const {data:verified,error:verifyError}=await client.from('pairs')
      .select('id,category_id,participation_status,group_name').eq('category_id',cat.id);
    if(verifyError||!verified)throw Error('保存後のDB照合に失敗しました：'+(verifyError?.message||'データなし'));
    const expected=new Map(assignments.map(a=>[a.pair_id,a.group_name]));
    const active=verified.filter(p=>p.participation_status==='active');
    if(active.length!==expected.size||active.some(p=>!expected.has(p.id)||expected.get(p.id)!==p.group_name))throw Error('保存後のDB組分けがプレビューと一致しません。');
    await loadData();
    if(state.error)throw Error('組分けは保存された可能性がありますが、画面の再取得に失敗しました。');
    groupingPreview.success=true;
    groupingPreview.message=`確定保存完了：${assignments.length}ペア／${choice.count}組。Supabaseから再取得して照合しました。`;
  }catch(e){
    groupingPreview.success=false;
    groupingPreview.message='保存結果を確認できませんでした：'+e.message+'。自動再送信はしません。「更新」でDBの組分け状況を確認してください。';
  }finally{groupingPreview.busy=false;render();}
}

function drawPlan(t,cat){

  const active=all.filter(p=>p.participation_status==='active');
  const groups=[...new Set(active.map(p=>p.group_name))].sort();
  const max=Number(cat.preliminary_group_max_pairs);
  const planned=Number(cat.planned_pairs);
  const issues=[];
  if(!Number.isInteger(max)||max<3||max>6)issues.push('1組の最大ペア数が未設定です。');
  if(!Number.isInteger(planned)||active.length>planned)issues.push('募集枠の設定を確認してください。');
  if(active.length<3||active.length>256)issues.push('有効ペア数は3〜256ペアにしてください。');
  if(all.some(p=>p.participation_status!=='active'&&p.group_name!=null))issues.push('参加対象外のペアに組分けが残っています。');
  if(active.some(p=>!p.group_name))issues.push('組分け未確定の有効ペアがあります。');
  const sizes=groups.map(g=>active.filter(p=>p.group_name===g).length);
  if(!groups.length||sizes.some(n=>n<3||n>max)||Math.max(...sizes)-Math.min(...sizes)>1)issues.push('組人数または均等配置が正しくありません。');
  if(groups.some((g,i)=>g!==groupLabel(i)))issues.push('組名はA組から連続している必要があります。');
  const matches=groups.flatMap(g=>{
    const ps=active.filter(p=>p.group_name===g).sort((a,b)=>a.display_name.localeCompare(b.display_name,'ja')||a.id.localeCompare(b.id));
    const out=[];
    for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)out.push({group:g,a:ps[i],b:ps[j]});
    return out;
  });
  if(state.matches.some(m=>m.category_id===cat.id)||state.stages.some(st=>st.category_id===cat.id))issues.push('既存の試合またはステージがあります。再生成できません。');
  if(state.approved.some(a=>a.category_id===cat.id)||state.qualificationLocks.includes(cat.id))issues.push('順位承認または決勝進出者の確定があります。');
  if(state.officialResults.some(r=>r.category_id===cat.id&&r.status!=='unconfirmed'))issues.push('正式結果の確定・取消情報があります。');
  if(state.bracketSlots.some(sl=>state.stages.some(st=>st.id===sl.stage_id&&st.category_id===cat.id)))issues.push('決勝対戦枠が存在します。');
  return {active,groups,sizes,matches,issues};
}

  const begin=begin0+EVENT_PREP_MINUTES,deadline=end0-EVENT_CLOSE_MINUTES;
  const duration=Number(t.match_minutes),rest=Number(t.minimum_rest_minutes),limit=Number(t.max_consecutive_matches);

  const courts=state.courts.filter(c=>c.tournament_id===t.id&&c.court_type==='official'&&c.is_active).sort((a,b)=>a.name.localeCompare(b.name,'ja',{numeric:true})||a.id.localeCompare(b.id));

            if(overlapping.filter(r=>r.match.category_id===categoryId).length>=w.max)continue;

  }

  const errors=[],times=new Map(),byPerson=new Map();
  for(const r of rows){const w=windowMap.get(r.match.category_id),key=r.start+'|'+r.court.id;
    if(times.has(key))errors.push('コート重複');times.set(key,true);
    if(r.start<w.start||r.end>w.end||r.end>deadline||r.start<begin||r.end-r.start!==duration)errors.push('時間枠違反');
    for(const person of r.persons){if(!byPerson.has(person))byPerson.set(person,[]);byPerson.get(person).push(r);}
  }
  for(const rr of byPerson.values()){
    rr.sort((a,b)=>a.start-b.start);let run=0,previous=null;

  }
  if(errors.length)throw Error('内部検証に失敗：'+[...new Set(errors)].join('、'));
  rows.sort((a,b)=>a.start-b.start||a.court.name.localeCompare(b.court.name,'ja',{numeric:true}));
  return {rows,pending,begin,deadline,courts,duration,total:all.length};
}

// STEP 22-6-9-139: whole-tournament fair rescheduling of draft, unplayed games.
// Preview never writes to DB. The original initial-save planner remains unchanged.
function reorganizationPreview(t){
  if(!t)throw Error('大会が選択されていません。');
  if(state.courtLoadError||state.error||state.loading)throw Error('試合・コート情報を取得できません。更新してください。');
  const catIds=new Set(state.categories.filter(c=>c.tournament_id===t.id).map(c=>c.id));
  const all=state.matches.filter(m=>catIds.has(m.category_id));
  if(!all.length)throw Error('この大会に対戦表がありません。先に「6. 対戦表」を作成してください。');
  if(all.some(m=>stageFor(m)?.stage_type!=='preliminary'||m.status!=='scheduled'||!m.pair_a_id||!m.pair_b_id||m.score_a!=null||m.score_b!=null))throw Error('未対応の決勝試合、結果、試合状態が含まれます。既存データを保護するため仮配置を停止しました。');
  const begin0=parseWindowMinute(String(t.start_time||'').slice(0,5)),end0=parseWindowMinute(String(t.end_time||'').slice(0,5));
  const begin=begin0+EVENT_PREP_MINUTES,deadline=end0-EVENT_CLOSE_MINUTES;
  const duration=Number(t.match_minutes),rest=Number(t.minimum_rest_minutes),limit=Number(t.max_consecutive_matches);
  if(begin0===null||end0===null||!Number.isInteger(duration)||duration<1||!Number.isInteger(rest)||rest<0||!Number.isInteger(limit)||limit<1||begin+duration>deadline)throw Error('大会時間・休憩・連戦の設定が不正です。');
  const courts=state.courts.filter(c=>c.tournament_id===t.id&&c.court_type==='official'&&c.is_active).sort((a,b)=>a.name.localeCompare(b.name,'ja',{numeric:true})||a.id.localeCompare(b.id));
  if(!courts.length)throw Error('使用できる公式コートがありません。');
  const pairById=new Map(state.pairs.map(p=>[p.id,p]));
  // Use names as a conservative cross-category double-entry guard.
  const people=m=>[m.pair_a_id,m.pair_b_id].flatMap(id=>{const p=pairById.get(id);if(!p||p.category_id!==m.category_id||p.participation_status!=='active')throw Error('試合に紐づく有効ペアが確認できません。');return [p.player1,p.player2].map(v=>String(v||'').replace(/[\s\u3000]+/g,'').toLocaleLowerCase());});
  const tasks=all.map(m=>({m,persons:people(m)}));
  if(tasks.some(x=>x.persons.some(v=>!v)||new Set(x.persons).size!==4))throw Error('同一選手の重複・選手名の欠落があります。');
  const categoryMap=new Map(state.categories.map(c=>[c.id,c]));
  const windowMap=new Map();
  for(const id of catIds){const c=categoryMap.get(id);if(!all.some(m=>m.category_id===id))continue;
    const start=c.schedule_start_time?parseWindowMinute(String(c.schedule_start_time).slice(0,5)):begin;
    const end=c.schedule_end_time?parseWindowMinute(String(c.schedule_end_time).slice(0,5)):deadline;
    if(start===null||end===null)throw Error('カテゴリー開催枠が不正です。');
    windowMap.set(id,{start:Math.max(begin,start),end:Math.min(deadline,end),max:c.max_courts==null?courts.length:Number(c.max_courts),preferred:c.preferred_courts==null?courts.length:Number(c.preferred_courts)});
  }
  const pending=tasks.slice().sort((a,b)=>a.m.id.localeCompare(b.m.id));
   const categoryTotal=new Map();for(const x of tasks)categoryTotal.set(x.m.category_id,(categoryTotal.get(x.m.category_id)||0)+1);
   const categoryPlaced=new Map();
  const lastEnd=new Map(),lastSlot=new Map(),streak=new Map(),rows=[];
  for(let at=begin;pending.length&&at+duration<=deadline;at+=duration){
    const occupied=new Set(),usedCat=new Map(),usedCourts=new Set();
     // Fairness first: compare category completion ratios, not whether a game was previously assigned.
     // Within equal progress, tighter windows and long-waiting players come first.
    for(const court of courts){
    pending.sort((a,b)=>{
       const ca=a.m.category_id,cb=b.m.category_id;
       const ratio=(categoryPlaced.get(ca)||0)/categoryTotal.get(ca)-(categoryPlaced.get(cb)||0)/categoryTotal.get(cb);
       if(Math.abs(ratio)>1e-9)return ratio;
       const wa=windowMap.get(ca),wb=windowMap.get(cb);
       const slack=(wa.end-at)-(wb.end-at);if(slack)return slack;
       const waiting=Math.min(...a.persons.map(x=>lastEnd.get(x)??-99999))-Math.min(...b.persons.map(x=>lastEnd.get(x)??-99999));
       return waiting||a.m.id.localeCompare(b.m.id);
     });

      const index=pending.findIndex(task=>{
        const w=windowMap.get(task.m.category_id),catUsed=usedCat.get(task.m.category_id)||0;
        return at>=w.start&&at+duration<=w.end&&catUsed<w.max&&task.persons.every(person=>!occupied.has(person)&&(lastEnd.get(person)==null||at-lastEnd.get(person)>=rest)&&(lastSlot.get(person)!==at-duration||(streak.get(person)||0)<limit));
      });
      if(index<0)break;
      const task=pending.splice(index,1)[0];
      for(const person of task.persons){const consecutive=lastSlot.get(person)===at-duration;streak.set(person,consecutive?(streak.get(person)||0)+1:1);lastSlot.set(person,at);lastEnd.set(person,at+duration);occupied.add(person);}
      usedCourts.add(court.id);usedCat.set(task.m.category_id,(usedCat.get(task.m.category_id)||0)+1);
       categoryPlaced.set(task.m.category_id,(categoryPlaced.get(task.m.category_id)||0)+1);
      rows.push({match:task.m,court,start:at,end:at+duration,persons:task.persons});
    }
  }
  // Independently re-check every placed match, and all participant timelines.
  const errors=[],times=new Map(),byPerson=new Map();
  for(const r of rows){const w=windowMap.get(r.match.category_id),key=r.start+'|'+r.court.id;
    if(times.has(key))errors.push('コート重複');times.set(key,true);
    if(r.start<w.start||r.end>w.end||r.end>deadline||r.start<begin||r.end-r.start!==duration)errors.push('時間枠違反');
    for(const person of r.persons){if(!byPerson.has(person))byPerson.set(person,[]);byPerson.get(person).push(r);}
  }
  for(const rr of byPerson.values()){
    rr.sort((a,b)=>a.start-b.start);let run=0,previous=null;
    for(const r of rr){if(previous&&r.start<previous.end+rest)errors.push('選手の休憩・同時刻違反');run=previous&&r.start===previous.start+duration?run+1:1;if(run>limit)errors.push('連戦上限違反');previous=r;}
  }
  if(errors.length)throw Error('内部検証に失敗：'+[...new Set(errors)].join('、'));
  rows.sort((a,b)=>a.start-b.start||a.court.name.localeCompare(b.court.name,'ja',{numeric:true}));
  return {rows,pending,begin,deadline,courts,duration,total:all.length};
}

}

async function saveRealSchedule(){
 if(realScheduleSave.busy)return;
 const tid=categoryForm.tournamentId,t=state.tournaments.find(x=>x.id===tid);
 let plan;
 try{plan=realSchedulePreview(t);}catch(e){realScheduleSave.ok=false;realScheduleSave.message=e.message;render();return;}
 if(!scheduleSaveEligible(t,plan))return;
 const before=scheduleFingerprint(tid),assignments=scheduleAssignments(t,plan);
 if(assignments.length!==plan.total||new Set(assignments.map(a=>a.match_id)).size!==assignments.length){realScheduleSave.message='割当件数または試合IDが不正です。';realScheduleSave.ok=false;render();return;}
 if(!confirm(`大会「${t.name}」の時間割を確定して保存しますか？\n対象：${assignments.length}試合 / 公式コート ${plan.courts.length}面\n開始：${minuteClock(plan.begin)}／最終終了：${minuteClock(Math.max(...plan.rows.map(r=>r.end)))}\n\nこの画面では一度保存した時間割を再保存・上書きできません。`))return;
 realScheduleSave.busy=true;realScheduleSave.message='';realScheduleSave.ok=false;render();
 let rpcAttempted=false;
 try{
  await loadData();
  if(state.error||state.courtLoadError||categoryForm.tournamentId!==tid||scheduleFingerprint(tid)!==before)throw Error('保存直前に大会・試合・選手・コートの情報が変わりました。内容を再確認してください。');
  const latestT=state.tournaments.find(x=>x.id===tid),latestPlan=realSchedulePreview(latestT);
  if(!scheduleSaveEligible(latestT,latestPlan)&&!(realScheduleSave.busy&&latestPlan.pending.length===0&&latestPlan.rows.length===latestPlan.total&&latestT.status==='draft'&&state.tournamentAdminIds.includes(tid)&&state.staff))throw Error('保存直前の権限・配置チェックに失敗しました。');
  const fresh=scheduleAssignments(latestT,latestPlan);
  const byId=a=>new Map(a.map(x=>[x.match_id,x]));const expected=byId(assignments),actual=byId(fresh);
  if(actual.size!==expected.size||[...expected].some(([id,x])=>!actual.has(id)||actual.get(id).court_id!==x.court_id||actual.get(id).start_time!==x.start_time))throw Error('保存直前の仮時間割が変化しました。');
  rpcAttempted=true;
  const {data:saved,error:rpcError}=await client.rpc('admin_save_match_schedule',{p_tournament_id:tid,p_assignments:assignments});
  if(rpcError)throw Error(rpcError.message);
  if(Number(saved)!==assignments.length)throw Error('保存RPCの更新件数が一致しません。');
  const {data:verified,error:verifyError}=await client.from('matches').select('id,category_id,start_time,court_id').in('category_id',state.categories.filter(c=>c.tournament_id===tid).map(c=>c.id));
  if(verifyError||!verified)throw Error('保存後の試合データ取得に失敗しました：'+(verifyError?.message||''));
  if(verified.length!==expected.size||verified.some(m=>!expected.has(m.id)||m.court_id!==expected.get(m.id).court_id||new Date(m.start_time).getTime()!==new Date(expected.get(m.id).start_time).getTime()))throw Error('保存後の割当がプレビューと一致しません。');
  await loadData();
  if(state.error||state.courtLoadError||tournamentMatches(tid).length!==expected.size)throw Error('保存後の画面更新を確認できませんでした。');
  realScheduleSave.ok=true;realScheduleSave.message=`正式保存完了：${expected.size}試合。Supabaseから時刻・コートを再取得して照合しました。`;
 }catch(e){realScheduleSave.ok=false;realScheduleSave.message='保存結果を確認できませんでした：'+e.message+(rpcAttempted?'。保存された可能性があります。再送信せず「更新」でDBの割当状態を確認してください。':'。DBへの保存処理は呼び出していません。');}
 finally{realScheduleSave.busy=false;render();}
}

const returnDraftState={busy:false,tid:'',message:'',error:''};
const publishState={tid:'',checks:null,busy:false,message:'',error:'',published:false,version:0};
function clearPublishState(){publishState.tid='';publishState.checks=null;publishState.message='';publishState.error='';publishState.published=false;publishState.version++;}
function publishAllowed(t){return !!client&&!!state.auth&&state.staff&&state.tournamentAdminLoaded&&!state.tournamentAdminError&&state.tournamentAdminIds.includes(t?.id)&&!state.loading&&!state.error;}
const publishOpenPanels={publish:false,print:false,returnDraft:false};
function publishSection(t){
 if(!t)return '<div class="notice">対象大会がありません。</div>';
 const chosen=publishState.tid===t.id,checks=chosen?publishState.checks:null;
 const admin=publishAllowed(t),draft=t.status==='draft',published=['published','in_progress','completed'].includes(t.status);
 const matches=tournamentMatches(t.id),cats=state.categories.filter(c=>c.tournament_id===t.id);
 const pass=!!checks&&checks.length===7&&checks.every(x=>x.result==='PASS');
 const loading=publishState.busy;
 const table=checks?`<div class="tablebox"><table class="tbl"><thead><tr><th>確認項目</th><th>結果</th><th>詳細</th></tr></thead><tbody>${checks.map(c=>`<tr><td>${esc(c.check_name)}</td><td><b>${c.result==='PASS'?'OK':'要確認'}</b></td><td style="white-space:normal">${esc(c.detail)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="prompt">公開前に7項目を確認します。</p>';
 const canPublish=admin&&draft&&pass&&!loading&&!state.courtLoadError;
 const statusLabel={draft:'下書き（非公開）',published:'公開済み',in_progress:'開催中',completed:'終了済み'}[t.status]||t.status;
 const fold=(key,title,content)=>`<details class="basic-panel" data-publish-panel="${key}" ${publishOpenPanels[key]?'open':''}><summary>${title}<span class="panel-chevron">開閉</span></summary><div class="basic-panel-content">${content}</div></details>`;
 const intro=`<div class="row"><h3>${esc(t.name)}</h3><span class="status ${published?'done':'pending'}">${esc(statusLabel)}</span></div><p class="prompt">開催日：${esc(t.event_date||'未設定')} ／ ${cats.length}カテゴリー ／ ${matches.length}試合</p>`;
 const checkSection=`${intro}${published?'<div class="notice blue">公開済みです。</div>':table}${draft?`<button type="button" id="runPublishCheck" class="btn wide" style="display:block;margin-top:20px" ${admin&&!loading?'':'disabled'}>${loading?'確認中…':'公開前チェックを実行'}</button>`:''}${draft&&!checks?'<p class="prompt">まず「公開前チェックを実行」を押してください。</p>':''}${draft&&checks&&!pass?'<div class="notice">要確認の項目があります。修正後に再チェックしてください。</div>':''}${draft?`<button type="button" id="confirmPublishTournament" class="btn wide" style="display:block;margin-top:16px" ${canPublish?'':'disabled'}>${canPublish?'大会を公開する（確定）':'大会を公開する（チェックOKで有効）'}</button>`:''}${draft&&!canPublish?'<p class="prompt">すべての確認項目がOKになると公開できます。</p>':''}${publishState.message&&chosen?`<div class="notice blue" role="status">${esc(publishState.message)}</div>`:''}${publishState.error&&chosen?`<div class="empty-error" role="alert">${esc(publishState.error)}</div>`:''}`;
 const printSection=`<p class="prompt">対戦表・時間割を印刷、またはPDFに保存できます。</p><button type="button" class="btn secondary wide" id="printTournamentSchedule" ${matches.length&&!state.loading&&!state.error&&!state.courtLoadError?'':'disabled'}>対戦表・時間割を印刷</button><button type="button" class="btn secondary wide" style="display:block;margin-top:16px" id="printScoreSheets" ${matches.length&&!state.loading&&!state.error&&!state.courtLoadError?'':'disabled'}>スコア表を印刷</button><p class="prompt">通信障害時は印刷した紙で進行し、復旧後に結果を入力してください。</p>`;
 const backSection=t.status==='published'?fold('returnDraft','大会準備に戻す（要注意）',`<div class="notice">対戦表・時間割・決勝仮枠と組分けを削除します。元の時間割は復元できません。参加ペア・大会設定・コートは残ります。受付・結果・変更履歴がある場合は実行できません。</div><button type="button" id="returnTournamentToDraft" class="btn secondary wide" ${admin&&!loading&&!returnDraftState.busy?'':'disabled'}>${returnDraftState.busy?'処理中…':'準備に戻す（対戦表・時間割をリセット）'}</button>${returnDraftState.tid===t.id&&returnDraftState.message?`<div class="notice blue" role="status">${esc(returnDraftState.message)}</div>`:''}${returnDraftState.tid===t.id&&returnDraftState.error?`<div class="empty-error" role="alert">${esc(returnDraftState.error)}</div>`:''}`):'';
 return `<h2>公開・印刷</h2>${fold('publish','1. 公開前チェック・大会公開',checkSection)}${fold('print','2. 印刷物',printSection)}${backSection}`;
}

async function returnTournamentToDraft(){
 const tid=categoryForm.tournamentId;
 const t=state.tournaments.find(x=>x.id===tid);
 if(!t||t.status!=='published'||!publishAllowed(t)||publishState.busy||returnDraftState.busy)return;
 if(!confirm(`大会「${t.name}」を準備に戻しますか？\n\n未実施の対戦表・時間割・決勝仮枠と組分けを削除します。\n参加ペア・カテゴリー・コート・大会基本設定は残します。\n元の時間割は復元できません。再公開まで大会は非公開となります。\n\n受付・試合結果・履歴がある場合はサーバー側で拒否されます。`))return;
 returnDraftState.busy=true;returnDraftState.tid=tid;returnDraftState.error='';returnDraftState.message='';render();
 let attempted=false;
 try{
  const auth=await client.auth.getUser();
  if(auth.error||!auth.data.user||auth.data.user.id!==state.auth?.id)throw Error('ログイン状態が変更されました');
  const {data:latest,error:readError}=await client.from('tournaments').select('id,status,event_date,start_time').eq('id',tid).single();
  if(readError||!latest||latest.status!=='published')throw Error('大会の状態が変更されました。更新してください');
  if(categoryForm.tournamentId!==tid)throw Error('操作対象の大会が変わりました');
  attempted=true;
  const {data:deleted,error}=await client.rpc('admin_return_tournament_to_draft',{p_tournament_id:tid});
  if(error)throw Error(error.message);
  if(!Number.isInteger(Number(deleted))||Number(deleted)<0)throw Error('処理件数を確認できませんでした');
  const {data:verified,error:verifyError}=await client.from('tournaments').select('status').eq('id',tid).single();
  if(verifyError||verified?.status!=='draft')throw Error('下書き状態を確認できませんでした');

  clearPublishState();

 }catch(e){returnDraftState.error='準備に戻す処理を確認できませんでした：'+e.message+(attempted?'。処理された可能性があります。再実行せず「更新」で大会の状態を確認してください。':'。更新処理は呼び出していません。');}
 finally{returnDraftState.busy=false;render();}
}

function printTournament(){
 const t=state.tournaments.find(x=>x.id===categoryForm.tournamentId);
 if(!t||state.loading||state.error||state.courtLoadError)return;
 const cats=state.categories.filter(c=>c.tournament_id===t.id).sort((a,b)=>(a.display_order||0)-(b.display_order||0)||a.name.localeCompare(b.name,'ja'));
 const ms=tournamentMatches(t.id).slice().sort((a,b)=>(a.start_time||'').localeCompare(b.start_time||'')||courtName(a.court_id).localeCompare(courtName(b.court_id),'ja',{numeric:true}));
 if(!ms.length){alert('印刷する試合がありません。');return;}
 const popup=window.open('','_blank');if(!popup){alert('印刷画面を開けませんでした。ポップアップを許可してください。');return;}
 const colorBases=[['#d9eee4','#b7ddcc','#21684f'],['#dceafa','#bdd6f2','#285b90'],['#fff0dc','#f9d6a9','#90591d'],['#f1e3f8','#dec4ed','#72458c'],['#fae2e5','#f0c1cb','#903e52'],['#e5eeef','#c2d8dc','#365b64']];
 const palette=new Map(cats.map((c,i)=>[c.id,colorBases[i%colorBases.length]]));
 const groupNames=new Map(cats.map(c=>[c.id,[...new Set(state.pairs.filter(p=>p.category_id===c.id&&p.group_name).map(p=>p.group_name).concat(ms.filter(m=>m.category_id===c.id&&m.group_name).map(m=>m.group_name)))].sort((a,b)=>String(a).localeCompare(String(b),'ja',{numeric:true}))]));
 const groupColors=['#d9eee4','#dceafa','#fff0dc','#f1e3f8','#fae2e5','#e5eeef','#fff5cd','#e0e8ff','#e4f4d9','#fce3f0','#d9f0f0','#f7e6d7'];
 // Finals have a dedicated purple treatment in both the timetable and final sheets.
 const FINAL_PRINT_COLOR='#eae2f8',FINAL_PRINT_BORDER='#7856ad';
 const styleFor=(catId,group,isFinal=false)=>{const p=palette.get(catId)||colorBases[0];if(isFinal)return `background:${FINAL_PRINT_COLOR};border-top:4px solid ${FINAL_PRINT_BORDER};`;const idx=(groupNames.get(catId)||[]).indexOf(group);const background=idx>=0?groupColors[idx%groupColors.length]:p[0];return `background:${background};border-top:4px solid ${p[2]};`;};
 // Printed match identifiers must work even when the match-number RPC was unavailable.
 // Assign stable local IDs by category, preliminary group/pair order, then final bracket slots.
 const localPrintNumbers=new Map();
 let printIndex=0;
 for(const c of cats){
   const catMatches=ms.filter(m=>m.category_id===c.id);
   const prelim=catMatches.filter(m=>stageFor(m)?.stage_type==='preliminary');
   prelim.sort((a,b)=>String(a.group_name||'').localeCompare(String(b.group_name||''))||
     [pairName(a.pair_a_id),pairName(a.pair_b_id)].sort().join('|').localeCompare([pairName(b.pair_a_id),pairName(b.pair_b_id)].sort().join('|'),'ja')||a.id.localeCompare(b.id));
   const finals=catMatches.filter(m=>stageFor(m)?.stage_type==='knockout');
   const slotOf=m=>state.bracketSlots.find(x=>x.match_id===m.id);
   finals.sort((a,b)=>Number(slotOf(a)?.round_number||0)-Number(slotOf(b)?.round_number||0)||Number(slotOf(a)?.match_number||0)-Number(slotOf(b)?.match_number||0)||a.id.localeCompare(b.id));
   for(const m of [...prelim,...finals])localPrintNumbers.set(m.id,'M-'+String(++printIndex).padStart(3,'0'));
 }
 const matchCodeText=m=>esc(matchCode(m)||localPrintNumbers.get(m.id)||'—');
 const timeText=m=>m.start_time?new Date(m.start_time).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'}):'未割当';
 const courts=state.courts.filter(c=>c.tournament_id===t.id&&c.is_active&&c.court_type==='official').slice();
 ms.forEach(m=>{if(m.court_id&&!courts.some(c=>c.id===m.court_id)){const c=state.courts.find(x=>x.id===m.court_id);if(c)courts.push(c);}});
 courts.sort((a,b)=>a.name.localeCompare(b.name,'ja',{numeric:true}));
 const assigned=ms.filter(m=>m.start_time&&m.court_id),unassigned=ms.filter(m=>!m.start_time||!m.court_id);
 const timeKeys=[...new Set(assigned.map(timeText))].sort();
 const slotMap=new Map();
 assigned.forEach(m=>{const key=timeText(m)+'|'+m.court_id;if(!slotMap.has(key))slotMap.set(key,[]);slotMap.get(key).push(m);});
 const printMatchLabel=m=>{
   const stage=stageFor(m);
   if(stage?.stage_type!=='knockout')return m.group_name?m.group_name+'組':'予選';
   if(stage?.settings?.provisional_layout_version==='three_groups_top1_round_robin_v1')return '決勝総当たり';
   if(isThirdPlaceMatch(m))return '3位決定戦';
   const slot=state.bracketSlots.find(x=>x.match_id===m.id);
   if(!slot)return '決勝トーナメント';
   const categorySlots=state.bracketSlots.filter(x=>x.stage_id===m.stage_id&&!isThirdPlaceMatch(state.matches.find(mm=>mm.id===x.match_id)));
   const highest=Math.max(...categorySlots.map(x=>Number(x.round_number)));
   if(Number(slot.round_number)===highest)return '決勝';
   if(Number(slot.round_number)===highest-1)return '準決勝'+(categorySlots.filter(x=>Number(x.round_number)===Number(slot.round_number)).length>1?'①②③④⑤⑥⑦⑧'[Number(slot.match_number)-1]||' '+slot.match_number:'');
   return '決勝T '+slot.round_number+'回戦'+slot.match_number;
 };
 // The labels are derived from the saved bracket's rank-slot mapping, not from a guessed seed.
 const printFixtureSide=(m,side)=>{
   const pairId=side==='A'?m.pair_a_id:m.pair_b_id;
   if(pairId)return pairName(pairId);
   const stage=stageFor(m);
   if(stage?.stage_type!=='knockout')return '対戦相手未確定';
   const slot=state.bracketSlots.find(x=>x.match_id===m.id);
   const thirdId=stage.settings?.third_place?.match_id;
   if(m.id===thirdId)return side==='A'?'準決勝①の敗者':'準決勝②の敗者';
   const slots=state.bracketSlots.filter(x=>x.stage_id===m.stage_id&&x.match_id!==thirdId);
   const highest=slots.length?Math.max(...slots.map(x=>Number(x.round_number))):0;
   if(slot&&slot.next_slot_id==null&&Number(slot.round_number)===highest&&highest>1){
     const bye=stage.settings?.bye_qualifier;
     if(bye?.target_match_id===m.id&&bye.target_position===side)return `${bye.group_name}組${bye.preliminary_rank}位（BYE）`;
     const source=slots.find(x=>x.next_slot_id===slot.id&&x.next_position===side);
     return source?`準決勝${slots.filter(x=>Number(x.round_number)===Number(source.round_number)).length>1?source.match_number:''}の勝者`:'進出者未確定';
   }
   const rankSlots=stage.settings?.provisional_rank_slots||{};
   const key='round_'+Number(slot?.round_number)+'_match_'+Number(slot?.match_number);
   return rankSlots[key]?.[side]||'進出者未確定';
 };
 const matchTile=m=>`<div class="game-tile" style="${styleFor(m.category_id,m.group_name,stageFor(m)?.stage_type==='knockout')}"><div class="tile-top"><b>${matchCodeText(m)}</b><b>${esc(printMatchLabel(m))}</b></div><div class="tile-category">${esc(catName(m.category_id))}</div><div class="tile-teams">${esc(printFixtureSide(m,'A'))}<span class="vs">vs</span>${esc(printFixtureSide(m,'B'))}</div></div>`;
 // Use one flowing table and let the print engine paginate between complete rows.
 // The browser repeats the column heading on each printed page.
 const schedule=`<section class="timetable-page"><table class="schedule"><thead><tr><th class="time-head">開始</th>${courts.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>${timeKeys.map(time=>`<tr><th class="time-head">${esc(time)}</th>${courts.map(c=>{const games=slotMap.get(time+'|'+c.id)||[];return `<td class="${games.length===1?'schedule-filled':''}" ${games.length===1?`style="${styleFor(games[0].category_id,games[0].group_name,stageFor(games[0])?.stage_type==='knockout')}"`:''}>${games.length?games.map(matchTile).join(''):'<div class="empty-slot">—</div>'}</td>`;}).join('')}</tr>`).join('')}</tbody></table></section>`;
 const headings=`<h1>${esc(t.name)} <span class="draft">${t.status==='draft'?'【確認用・非公開】':'【'+esc(t.status)+'】'}</span></h1><p class="subtitle">開催日：${esc(t.event_date||'未設定')} ／ 開催時間：${esc((t.start_time||'').slice(0,5))}〜${esc((t.end_time||'').slice(0,5))}</p>`;
 const groupSheets=[];
 for(const c of cats){
   const groups=groupNames.get(c.id)||[];
   for(const g of groups){
     const pairs=state.pairs.filter(p=>p.category_id===c.id&&p.group_name===g&&p.participation_status==='active').slice().sort((a,b)=>a.display_name.localeCompare(b.display_name,'ja')||a.id.localeCompare(b.id));
     const games=ms.filter(m=>m.category_id===c.id&&m.group_name===g);
     if(!pairs.length&&!games.length)continue;
     const included=[...pairs];
     const pairIds=new Set(included.map(p=>p.id));
     for(const m of games)for(const id of [m.pair_a_id,m.pair_b_id])if(id&&!pairIds.has(id)){const p=state.pairs.find(x=>x.id===id&&x.category_id===c.id);if(p){included.push(p);pairIds.add(id);}}
     const names=included.map(p=>p.display_name||[p.player1,p.player2].filter(Boolean).join(' / ')||'名前未登録');
     const matchLookup=new Map(games.filter(m=>m.pair_a_id&&m.pair_b_id).map(m=>[[m.pair_a_id,m.pair_b_id].sort().join('|'),m]));
     const matrix=included.map((p,i)=>`<tr><th class="rowhead"><div class="pair-number">${i+1}</div>${esc(names[i])}</th>${included.map((other,j)=>{if(i===j)return '<td class="diagonal">—</td>';const match=matchLookup.get([p.id,other.id].sort().join('|'));return `<td class="write-score"><span class="match-num">${match?matchCodeText(match):'未登録'}</span><span class="score-blank">＿＿ - ＿＿</span></td>`;}).join('')}<td class="summary-cell"></td><td class="summary-cell"></td></tr>`).join('');
     const n=included.length;
     const table=n>=2?`<table class="league"><thead><tr><th class="rowhead">ペア</th>${included.map((p,i)=>`<th>${i+1}<small>${esc(names[i])}</small></th>`).join('')}<th class="summary-head">勝敗</th><th class="summary-head">順位</th></tr></thead><tbody>${matrix}</tbody></table>`:'<p>組の登録ペアが不足しています。</p>';
     groupSheets.push(`<section class="sheet"><div class="group-banner" style="${styleFor(c.id,g)}"><h2>${esc(c.name)} ／ ${esc(g)}組　リーグ表</h2><p>${n}ペア ／ ${games.length}試合</p></div>${table}<p class="league-notes">各試合は対称な2マスに同じ試合番号を表示します。両方のマスに「自ペアの得点 - 相手ペアの得点」を記入します。例：A対Bが11-8ならA行B列に11-8、B行A列に8-11。勝敗・順位は集計後に記入してください。</p></section>`);
   }
   if(!groups.length)groupSheets.push(`<section class="sheet"><div class="group-banner" style="background:${palette.get(c.id)?.[0]||'#eee'}"><h2>${esc(c.name)} ／ リーグ表</h2></div><p>組分けは未登録です。</p></section>`);
 }
 // Printed knockout fixtures are prepared before qualifiers have been determined.
 // Labels use the saved preliminary group/rank mapping; pair IDs are shown only when known.
 const knockoutSheets=[];
 for(const c of cats){
   const stage=state.stages.find(st=>st.category_id===c.id&&st.stage_type==='knockout');
   if(!stage)continue;
   const bracketMatches=ms.filter(m=>m.stage_id===stage.id);
   if(!bracketMatches.length)continue;
   if(stage.settings?.provisional_layout_version==='three_groups_top1_round_robin_v1'){
     const rr=bracketMatches.map(m=>({m,slot:state.bracketSlots.find(x=>x.match_id===m.id)}))
       .sort((a,b)=>Number(a.slot?.match_number||0)-Number(b.slot?.match_number||0));
     const expected=[['A組1位','B組1位'],['B組1位','C組1位'],['A組1位','C組1位']];
     // Final-round robin uses the same score matrix as preliminary groups.
     // The provisional seeds have known group/rank labels even when pair IDs are null.
     const seeds=['A組1位','B組1位','C組1位'];
     const seedIndex=new Map(seeds.map((seed,i)=>[seed,i]));
     const fixtureByPair=new Map();
     for(const {m,slot} of rr){
       const n=Number(slot?.match_number);
       const fixture=expected[n-1];
       if(!fixture)continue;
       fixtureByPair.set(fixture.map(x=>seedIndex.get(x)).sort((x,y)=>x-y).join('|'),m);
     }
     const finalNames=seeds.map((seed,i)=>{
       const pairId=rr.flatMap(({m,slot})=>{
         const fixture=expected[Number(slot?.match_number)-1];
         if(!fixture)return [];
         return [fixture[0]===seed?m.pair_a_id:null,fixture[1]===seed?m.pair_b_id:null].filter(Boolean);
       })[0];
       return pairId?pairName(pairId):seed;
     });
     // Match the preliminary league sheet exactly: same columns, score cells and notes.
     const finalMatrix=seeds.map((seed,i)=>`<tr><th class="rowhead"><div class="pair-number">${i+1}</div>${esc(finalNames[i])}${finalNames[i]===seed?'<small style="display:block">氏名：＿＿＿＿＿＿＿＿</small>':''}</th>${seeds.map((other,j)=>{
       if(i===j)return '<td class="diagonal">—</td>';
       const m=fixtureByPair.get([i,j].sort((x,y)=>x-y).join('|'));
       return `<td class="write-score"><span class="match-num">${m?matchCodeText(m):'未登録'}</span><span class="score-blank">＿＿ - ＿＿</span></td>`;
     }).join('')}<td class="summary-cell"></td><td class="summary-cell"></td></tr>`).join('');
     const finalTable=`<table class="league final-league"><thead><tr><th class="rowhead">ペア</th>${seeds.map((seed,i)=>`<th>${i+1}<small>${esc(seed)}</small>${finalNames[i]===seed?'<small style="display:block">氏名：＿＿＿＿＿＿＿＿</small>':''}</th>`).join('')}<th class="summary-head">勝敗</th><th class="summary-head">順位</th></tr></thead><tbody>${finalMatrix}</tbody></table>`;
     knockoutSheets.push(`<section class="sheet"><div class="group-banner" style="background:#eae2f8;border-top:4px solid #7856ad"><h2>${esc(c.name)} ／ 決勝総当たりリーグ表</h2><p>3ペア ／ 3試合</p></div>${finalTable}<p class="league-notes">各試合は対称な2マスに同じ試合番号を表示します。両方のマスに「自ペアの得点 - 相手ペアの得点」を記入します。例：A対Bが11-8ならA行B列に11-8、B行A列に8-11。勝敗・順位は集計後に記入してください。</p></section>`);
     continue;
   }
   const slotFor=m=>state.bracketSlots.find(x=>x.match_id===m.id);
   const semifinals=bracketMatches.filter(m=>{
     const slot=slotFor(m);
     return slot&&Number(slot.round_number)===1&&slot.next_slot_id;
   }).sort((a,b)=>Number(slotFor(a).match_number)-Number(slotFor(b).match_number));
   const thirdId=stage.settings?.third_place?.match_id;
   const third=bracketMatches.find(m=>m.id===thirdId);
   const final=bracketMatches.find(m=>{
     const slot=slotFor(m);
     return slot&&m.id!==thirdId&&slot.next_slot_id==null;
   });
   const card=(m,title)=>{
     if(!m)return '';
     const participant=(side)=>{
       const rankLabel=printFixtureSide(m,side);
       const pairId=side==='A'?m.pair_a_id:m.pair_b_id;
       // Every slot has a handwriting line, even after the actual pair becomes known.
       return `<div class="ko-team"><span class="ko-seed">${esc(rankLabel)}</span><span class="ko-handwrite">ペア名：${pairId?esc(pairName(pairId))+'　':' '}＿＿＿＿＿＿＿＿＿＿＿＿</span></div>`;
     };
     return `<div class="ko-card"><h3>${esc(title)} <span>${matchCodeText(m)}</span></h3><p class="ko-meta">${esc(timeText(m))} ／ ${esc(courtName(m.court_id))}</p>${participant('A')}<div class="ko-vs">対</div>${participant('B')}<div class="ko-score">スコア　＿＿＿ 対 ＿＿＿</div></div>`;
   };
   // Three qualifying groups: draw a virtual BYE semifinal on paper only.
   // No match is inserted in Supabase and no timetable slot is consumed.
   const bye=stage.settings?.bye_qualifier;
   const hasPrintedBye=semifinals.length===1&&!!final&&bye?.target_match_id===final.id&&bye?.target_position==='A';
   const byePairId=final?.pair_a_id;
   const byeLabel=`${bye?.group_name||'A'}組${bye?.preliminary_rank||1}位`;
   const printedByeCard=hasPrintedBye?`<div class="ko-card ko-bye-card"><h3>準決勝① <span>BYE／試合なし</span></h3><p class="ko-meta">不戦勝のため試合・時刻・コート割当なし</p><div class="ko-team"><span class="ko-seed">${esc(byeLabel)}</span><span class="ko-handwrite">ペア名：${byePairId?esc(pairName(byePairId))+'　':''}＿＿＿＿＿＿＿＿＿＿＿＿</span></div><div class="ko-bye-marker">BYE（決勝へ自動進出）</div></div>`:'';
   const semiCards=semifinals.map((m,i)=>card(m,hasPrintedBye?'準決勝②':'準決勝'+(i+1))).join('');
   const printedSemis=hasPrintedBye?`<div class="ko-tree-entry">${printedByeCard}</div><div class="ko-tree-entry">${card(semifinals[0],'準決勝②')}</div>`:'';
   const prelimRankNote=semifinals.length===0&&final?'予選各組の順位が確定後、出場ペア名を記入してください。':'対戦条件（A組1位など）を確認し、出場ペア名を空欄に記入してください。準決勝の勝者を決勝に記入してください。3位決定戦がある場合のみ敗者も記入してください。';
   knockoutSheets.push(`<section class="sheet"><div class="group-banner" style="background:${FINAL_PRINT_COLOR};border-top:4px solid ${FINAL_PRINT_BORDER}"><h2>${esc(c.name)} ／ 決勝トーナメント対戦表</h2><p>${bracketMatches.length}試合（3位決定戦を含む場合は別枠に表示）</p></div><p class="legend">${esc(prelimRankNote)}</p><div class="ko-tree">${hasPrintedBye?`<div class="ko-tree-semis">${printedSemis}</div><div class="ko-tree-connector" aria-hidden="true"><span class="ko-branch-top"></span><span class="ko-branch-bottom"></span><span class="ko-branch-out"></span></div><div class="ko-tree-final">${card(final,'決勝')}<p class="ko-tree-hint">準決勝①はBYE／準決勝②の勝者が決勝へ</p></div>`:semifinals.length===2?`<div class="ko-tree-semis"><div class="ko-tree-entry">${card(semifinals[0],'準決勝①')}</div><div class="ko-tree-entry">${card(semifinals[1],'準決勝②')}</div></div><div class="ko-tree-connector" aria-hidden="true"><span class="ko-branch-top"></span><span class="ko-branch-bottom"></span><span class="ko-branch-out"></span></div><div class="ko-tree-final">${card(final,'決勝')}<p class="ko-tree-hint">準決勝の勝者が決勝へ進出 →</p></div>`:semifinals.length===0?`<div class="ko-tree-final ko-tree-direct">${card(final,'決勝')}</div>`:`<div class="ko-tree-semis">${semiCards}</div><div class="ko-tree-single-connector" aria-hidden="true"></div><div class="ko-tree-final">${card(final,'決勝')}<p class="ko-tree-hint">A組1位はBYE（決勝へ直行）</p></div>`}</div>${third?`<div class="ko-third"><h3>3位決定戦（準決勝敗者同士）</h3>${card(third,'3位決定戦')}</div>`:''}<div class="ko-placing">優勝：＿＿＿＿＿＿＿＿　準優勝：＿＿＿＿＿＿＿＿　${third?'3位：＿＿＿＿＿＿＿＿':''}</div></section>`);

function intField(raw,min,max,label){if(!/^\d+$/.test(String(raw)))throw Error(label+'は整数で入力してください。');const n=Number(raw);if(!Number.isSafeInteger(n)||n<min||n>max)throw Error(label+'は'+min+'〜'+max+'の整数で指定してください。');return n;}
function validateNewTournament(){
 const d=newTournamentDraft;
 if(!d.name.trim()||d.name.trim().length>200)throw Error('大会名を1〜200文字で入力してください。');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||Number.isNaN(Date.parse(d.date+'T00:00:00')))throw Error('開催日を入力してください。');
 const s=parseWindowMinute(d.start),e=parseWindowMinute(d.end);
 if(s===null||e===null||s>=e)throw Error('大会の開始・終了時刻を正しく指定してください。');
 const minutes=intField(d.minutes,1,180,'試合時間'),rest=intField(d.rest,0,180,'最低休憩'),consecutive=intField(d.consecutive,1,10,'最大連戦'),courts=intField(d.courts,0,100,'公式コート数');
 const categories=[]; // 新規作成時はカテゴリーを登録しない。作成後に個別追加する。
 return {p_name:d.name.trim(),p_event_date:d.date,p_start_time:d.start,p_end_time:d.end,p_match_minutes:minutes,p_minimum_rest_minutes:rest,p_max_consecutive_matches:consecutive,p_official_courts:courts,p_categories:categories};
}

function slotDiagram(slots,cat,stage){
  const ordered=[...slots].sort((a,b)=>a.round_number-b.round_number||a.match_number-b.match_number);
  if(!ordered.length)return '<div class="empty">対戦枠がありません。</div>';
  const byId=new Map(ordered.map(s=>[s.id,s]));
  const matchById=new Map(state.matches.map(m=>[m.id,m]));
  const highest=Math.max(...ordered.map(s=>s.round_number));
  const first=ordered.filter(s=>s.round_number===1);
  const center=new Map();
  // Preserve bracket topology using each slot's actual next_slot_id.
  first.forEach((s,i)=>center.set(s.id,75+i*135));
  for(let round=2;round<=highest;round++){
    ordered.filter(s=>s.round_number===round).forEach((s,i)=>{
      const children=ordered.filter(x=>x.next_slot_id===s.id&&center.has(x.id));
      if(children.length)center.set(s.id,children.reduce((a,x)=>a+center.get(x.id),0)/children.length);
      else center.set(s.id,75+i*135*Math.pow(2,round-1));
    });
  }
  const colWidth=234,cardWidth=194,cardHeight=94;
  const boardWidth=highest*colWidth+12;
  const boardHeight=Math.max(180,...[...center.values()].map(y=>y+cardHeight/2+18));
  const path=ordered.filter(s=>s.next_slot_id&&byId.has(s.next_slot_id)).map(s=>{
    const target=byId.get(s.next_slot_id),x1=12+(s.round_number-1)*colWidth+cardWidth,
      x2=12+(target.round_number-1)*colWidth,
      y1=center.get(s.id),y2=center.get(target.id),mid=(x1+x2)/2;
    return `<path d="M ${x1} ${y1} H ${mid} V ${y2} H ${x2}" stroke="#90afb6" stroke-width="1.7" fill="none"/>`;
  }).join('');
  const cards=ordered.map(s=>{
    const m=matchById.get(s.match_id),x=12+(s.round_number-1)*colWidth,y=center.get(s.id)-cardHeight/2;
    if(!m)return `<div class="bracket-match" style="left:${x}px;top:${y}px"><small>試合情報を取得できません</small></div>`;
    const winner=isWalkover(m)?m.walkover_winner_pair_id:isDone(m)?(m.score_a>m.score_b?m.pair_a_id:m.pair_b_id):null;
    const line=(id,score)=>`<div class="bracket-team ${winner&&winner===id?'win':''}"><span title="${esc(pairName(id))}">${esc(pairName(id))}</span><b>${score??''}</b></div>`;
    const label=isThirdPlaceMatch(m)?'3位決定戦':s.round_number===highest?'決勝':s.round_number===highest-1?'準決勝':`${s.round_number}回戦`;
    return `<div class="bracket-match ${s.round_number===highest&&winner?'final-winner':''}" style="left:${x}px;top:${y}px"><div class="bracket-head"><span>${matchCode(m)?`<b class="match-number">${esc(matchCode(m))}</b> ／ `:''}${esc(label)} ${s.match_number}</span><span>${isWalkover(m)?'不戦勝':isDone(m)?'終了':m.status==='playing'?'試合中':'予定'}</span></div>${line(m.pair_a_id,m.score_a)}${line(m.pair_b_id,m.score_b)}${state.staff&&!officialLocked(m.category_id)&&m.pair_a_id&&m.pair_b_id?`<button class="btn secondary" data-edit="${esc(m.id)}">結果を操作</button>`:''}</div>`;
  }).join('');
  const mobileRoundNames=new Map();
  const normalSlots=ordered.filter(s=>!isThirdPlaceMatch(matchById.get(s.match_id)));
  const normalHighest=Math.max(...normalSlots.map(s=>s.round_number));
  const mobileCard=s=>{
    const m=matchById.get(s.match_id);
    if(!m)return '<div class="bracket-mobile-match">試合情報を取得できません</div>';
    const third=isThirdPlaceMatch(m);
    const winner=isWalkover(m)?m.walkover_winner_pair_id:isDone(m)?(m.score_a>m.score_b?m.pair_a_id:m.pair_b_id):null;
    const done=isWalkover(m)||isDone(m);
    const unresolved=!m.pair_a_id||!m.pair_b_id;
    const label=third?'3位決定戦':s.round_number===normalHighest?'決勝':s.round_number===normalHighest-1?'準決勝':`${s.round_number}回戦`;
    const status=isWalkover(m)?'不戦勝':isDone(m)?'終了':m.status==='playing'?'試合中':'予定';
    const team=(id,score)=>`<div class="bracket-mobile-team ${winner&&winner===id?'win':''}"><span>${esc(pairName(id))}</span><b>${score??''}</b></div>`;
    return `<div class="bracket-mobile-match ${winner&&s.round_number===normalHighest&&!third?'final-winner':''}"><div class="bracket-mobile-head"><span>${matchCode(m)?`<b class="match-number">${esc(matchCode(m))}</b> ／ `:''}${esc(label)} ${s.match_number}</span><span class="status ${done?'done':m.status==='playing'?'pending':''}">${esc(status)}</span></div>${unresolved?'<p class="prompt">対戦相手の確定待ち</p>':team(m.pair_a_id,m.score_a)+team(m.pair_b_id,m.score_b)}${state.staff&&!officialLocked(m.category_id)&&!unresolved?`<button class="btn secondary" data-edit="${esc(m.id)}">${done?'結果を確認':'結果を入力'}</button>`:''}</div>`;
  };
  const mobileRounds=[...new Set(normalSlots.map(s=>s.round_number))].sort((a,b)=>a-b).map((round,i)=>{
    const title=round===normalHighest?'決勝':round===normalHighest-1?'準決勝':`${round}回戦`;
    return `${i?'<div class="bracket-mobile-arrow" aria-hidden="true">↓</div>':''}<div class="bracket-mobile-round"><div class="bracket-mobile-title">${esc(title)}</div>${normalSlots.filter(s=>s.round_number===round).map(mobileCard).join('')}</div>`;
  }).join('');
  const thirdSlots=ordered.filter(s=>isThirdPlaceMatch(matchById.get(s.match_id)));
  const mobileThird=thirdSlots.length?`<div class="bracket-mobile-round"><div class="bracket-mobile-title">3位決定戦</div>${thirdSlots.map(mobileCard).join('')}</div>`:'';
  const mobile=`<div class="bracket-mobile">${mobileRounds}${mobileThird}</div>`;
  return mobile+`<div class="bracket-desktop"><div class="bracket-legend"><span>緑：勝者</span><span>線：次の対戦</span></div><div class="bracket-scroller"><div class="bracket-board" style="width:${boardWidth}px;height:${boardHeight}px"><svg class="bracket-lines" width="${boardWidth}" height="${boardHeight}" viewBox="0 0 ${boardWidth} ${boardHeight}" aria-hidden="true">${path}</svg>${cards}</div></div></div>`;
}
function championSummary(slots) {
  if (!slots.length) return '';
  const lastRound=Math.max(...slots.map(s=>Number(s.round_number)));
  const finalSlots=slots.filter(s=>Number(s.round_number)===lastRound&&!isThirdPlaceMatch(state.matches.find(m=>m.id===s.match_id)));
  // Only a single final establishes one bracket champion; otherwise avoid false claims.
  if (finalSlots.length!==1) return '';
  const finalMatch=state.matches.find(m=>m.id===finalSlots[0].match_id);
  if (!finalMatch) return '';
  const winnerId=isWalkover(finalMatch)
    ? finalMatch.walkover_winner_pair_id
    : isDone(finalMatch)&&finalMatch.score_a!==finalMatch.score_b
      ? (finalMatch.score_a>finalMatch.score_b?finalMatch.pair_a_id:finalMatch.pair_b_id)
      : null;
  const valid=winnerId&&(winnerId===finalMatch.pair_a_id||winnerId===finalMatch.pair_b_id);
  if (!valid) return `<div class="champion-panel champion-pending" aria-label="優勝ペア未確定"><div class="champion-kicker">🏆 優勝ペア：未確定</div><p class="champion-caption">決勝戦の結果登録後に表示します。</p></div>`;
  const score=isWalkover(finalMatch)?'決勝：不戦勝':`決勝：${finalMatch.score_a} – ${finalMatch.score_b}`;
  return `<div class="champion-panel" aria-label="決勝結果から算出した優勝ペア"><div class="champion-kicker">🏆 CHAMPION · 優勝ペア</div><div class="champion-name">${esc(pairName(winnerId))}</div><div class="champion-result">${esc(score)}</div>${state.tab==='public_rankings'?'':'<p class="champion-caption">試合結果から算出した表示です（正式確定前）。</p>'}</div>`;
}
function unifiedChampionSummary(categoryId,slots,games){
 const official=officialFor(categoryId);
 if(official?.status==='confirmed'&&official.champion_pair_id){
  return `<div class="champion-panel" aria-label="正式確定済みの優勝ペア"><div class="champion-kicker">🏆 優勝ペア</div><div class="champion-name">${esc(pairName(official.champion_pair_id))}</div>${state.tab==='public_rankings'?'':'<p class="champion-caption">正式確定済み</p>'}</div>`;
 }
 const ids=[...new Set(games.flatMap(m=>[m.pair_a_id,m.pair_b_id].filter(Boolean)))];
 const roundRobin=games.length===3&&ids.length===3&&games.every(m=>m.pair_a_id&&m.pair_b_id&&m.pair_a_id!==m.pair_b_id)&&ids.every(id=>games.filter(m=>m.pair_a_id===id||m.pair_b_id===id).length===2);
 if(roundRobin){
  return `<div class="champion-panel champion-pending" aria-label="優勝ペア未確定"><div class="champion-kicker">🏆 優勝ペア：未確定</div><p class="champion-caption">決勝リーグの結果を正式確定すると表示します。</p></div>`;
 }
 return championSummary(slots);
}
function finalRoundRobinTable(games,categoryId){
 if(games.length!==3)return '';
 const ids=[...new Set(games.flatMap(m=>[m.pair_a_id,m.pair_b_id].filter(Boolean)))];
 if(ids.length!==3||ids.some(id=>games.filter(m=>m.pair_a_id===id||m.pair_b_id===id).length!==2))return '';
 const stats=ids.map(id=>{
  let wins=0,losses=0,pointsFor=0,pointsAgainst=0;
  games.filter(m=>m.pair_a_id===id||m.pair_b_id===id).forEach(m=>{
   if(!isDone(m)&&!isWalkover(m))return;
   const win=isWalkover(m)?m.walkover_winner_pair_id:(m.score_a>m.score_b?m.pair_a_id:m.pair_b_id);
   if(win===id)wins++;else losses++;
   if(!isWalkover(m)){
    const own=m.pair_a_id===id?m.score_a:m.score_b;
    const opp=m.pair_a_id===id?m.score_b:m.score_a;
    pointsFor+=Number(own)||0;pointsAgainst+=Number(opp)||0;
   }
  });
  return {id,wins,losses,diff:pointsFor-pointsAgainst};
 });
 const allDone=games.every(m=>isDone(m)||isWalkover(m));
 if(allDone)stats.sort((a,b)=>b.wins-a.wins||b.diff-a.diff||pairName(a.id).localeCompare(pairName(b.id),'ja'));
 const rows=stats.map((r,i)=>`<tr><td><b>${allDone?`${i+1}位`:'—'}</b></td><td>${esc(pairName(r.id))}</td><td>${r.wins}勝${r.losses}敗</td><td>${r.diff>0?'+':''}${r.diff}</td></tr>`).join('');
 // Sort by displayed match number (M-010, M-011, M-012), not by participant order.
 const orderedGames=[...games].sort((a,b)=>{
  const ca=String(matchCode(a)||'');
  const cb=String(matchCode(b)||'');
  const na=Number((ca.match(/\d+/)||[])[0]);
  const nb=Number((cb.match(/\d+/)||[])[0]);
  if(Number.isFinite(na)&&Number.isFinite(nb)&&na!==nb)return na-nb;
  return ca.localeCompare(cb,'ja',{numeric:true})||String(a.id).localeCompare(String(b.id));
 });
 const matchRows=orderedGames.map(m=>{
  const done=isDone(m)||isWalkover(m);
  const result=isWalkover(m)?'不戦勝':isDone(m)?`${esc(m.score_a)} - ${esc(m.score_b)}`:'未入力';
  const action=state.staff&&!scoreEditLocked(m)&&m.pair_a_id&&m.pair_b_id?`<button type="button" class="btn secondary mini-btn" data-edit="${esc(m.id)}">${done?'結果修正':'結果入力'}</button>`:'';
  return `<div style="padding:12px 0;border-top:1px solid #e1e8eb"><div style="font-weight:700;margin-bottom:5px">${esc(matchCode(m)||'試合')} <span class="prompt" style="font-weight:400">${result}</span></div><div style="overflow-wrap:anywhere">${esc(pairName(m.pair_a_id))} 対 ${esc(pairName(m.pair_b_id))}</div>${action?`<div style="margin-top:8px">${action}</div>`:''}</div>`;
 }).join('');
 const confirmed=officialFor(categoryId)?.status==='confirmed';
 const guidance=confirmed||state.tab==='public_rankings'?'':`<div class="notice blue">決勝総当たりリーグ（3ペア・3試合）。順位は全試合終了後に表示します。正式順位は「優勝・準優勝・3位を正式確定」で確定してください。</div>`;
 return `${guidance}<section class="card"><h3>決勝リーグ順位</h3><table class="tbl" style="width:100%;table-layout:fixed"><thead><tr><th style="width:13%">順位</th><th style="width:43%">ペア</th><th style="width:25%">勝敗</th><th style="width:19%">得失点</th></tr></thead><tbody>${rows}</tbody></table>${state.tab==='public_rankings'?'':`<p class="prompt" style="margin-top:8px">${games.filter(m=>isDone(m)||isWalkover(m)).length}/3試合終了${allDone&&!confirmed?' ／ 暫定順位（正式確定前）':''}</p>`}</section><section class="card"><h3>決勝リーグの試合結果</h3>${matchRows}</section>`;
}

function bracket(){
  const ms=visibleMatches().filter(m=>stageFor(m)?.stage_type==='knockout');
  const byStage=[...new Set(ms.map(m=>m.stage_id))];
  const diagrams=byStage.map(stageId=>{
    const stage=state.stages.find(s=>s.id===stageId);
    const slots=state.bracketSlots.filter(s=>s.stage_id===stageId);
    return `<section class="bracket-stage"><h2>${esc(catName(stage?.category_id))} / ${esc(stage?.name||'決勝トーナメント')}</h2>${unifiedChampionSummary(stage?.category_id,slots,ms.filter(m=>m.stage_id===stageId))}${state.tab==='public_rankings'?'':officialPanel(stage?.category_id,slots,stageId)}${finalRoundRobinTable(ms.filter(m=>m.stage_id===stageId),stage?.category_id)|| (slots.length?slotDiagram(slots,stage?.category_id,stageId):`<div class="notice">対戦枠の読み取りができません。表示用RPCを設定するか「更新」を押してください。<br><small>${esc(state.bracketError)}</small></div><div class="grid">${ms.filter(m=>m.stage_id===stageId).map(matchCard).join('')}</div>`)}</section>`;
  }).join('');
  return `${controls()}<h2>決勝トーナメント</h2>${diagrams||'<div class="empty">決勝トーナメントの試合はまだありません。</div>'}`;
}
// Server-calculated preliminary rankings (including walkovers and true shared ranks).
const groupKey=(cat,group)=>cat+'::'+group;
function rankingGroups(){
 const ms=visibleMatches().filter(m=>stageFor(m)?.stage_type==='preliminary'&&m.group_name);
 const keys=[...new Set(ms.map(m=>groupKey(m.category_id,m.group_name)))];
 return keys.map(key=>{const m=ms.find(x=>groupKey(x.category_id,x.group_name)===key);return {key,cat:m.category_id,group:m.group_name,games:ms.filter(x=>groupKey(x.category_id,x.group_name)===key)};}).sort((a,b)=>{const ca=state.categories.find(c=>c.id===a.cat),cb=state.categories.find(c=>c.id===b.cat);return (Number(ca?.display_order??0)-Number(cb?.display_order??0))||String(ca?.name||'').localeCompare(String(cb?.name||''),'ja')||String(a.group).localeCompare(String(b.group),'ja',{numeric:true});});
}
async function refreshRankings(){
 if(!client||state.loading)return;
 const groups=rankingGroups();state.rankingLoading=true;state.rankingRows={};state.rankingLoadErrors={};state.approvedError='';state.approvedLoaded=false;state.qualificationLocks=[];state.qualificationLocksLoaded=false;state.qualificationLocksError='';render();
 try{
  const result=await client.from('approved_group_rankings').select('category_id,group_name,rank,pair_id,approved_at');
  if(result.error)throw Error('承認順位：'+result.error.message);
  state.approved=result.data||[];state.approvedLoaded=true;
  // Use confirmed qualifier rows, not bracket match slots, for the revocation lock.
  // Fail closed when the read-only lock RPC cannot be loaded.
  if(state.staff){
   const lockResult=await client.rpc('get_staff_knockout_qualification_locks');
   if(lockResult.error){state.qualificationLocksError=lockResult.error.message;}
   else{state.qualificationLocks=(lockResult.data||[]).map(x=>x.category_id);state.qualificationLocksLoaded=true;}
  }

  // Limit requests in batches to keep the preview responsive at larger events.
  for(let i=0;i<groups.length;i+=8){
   await Promise.all(groups.slice(i,i+8).map(async g=>{
    const {data,error}=await client.rpc('get_group_rankings',{p_category_id:g.cat,p_group_name:g.group});
    if(error)state.rankingLoadErrors[g.key]=error.message;
    else state.rankingRows[g.key]=data||[];
   }));
  }
 }catch(e){state.approvedError=e.message}
 finally{state.rankingLoading=false;render()}
}
function rankingViewSwitch(){return `<div class="match-view-switch" role="group" aria-label="順位・決勝の表示形式"><button type="button" data-ranking-view="preliminary" class="${rankingView==='preliminary'?'selected':''}" aria-pressed="${rankingView==='preliminary'}">予選</button><button type="button" data-ranking-view="final" class="${rankingView==='final'?'selected':''}" aria-pressed="${rankingView==='final'}">決勝</button></div>`;}
function rankingPage(){return rankingView==='final'?bracket().replace('<h2>決勝トーナメント</h2>',`<h2>順位・決勝</h2>${rankingViewSwitch()}`):ranking().replace('<h2>予選順位・承認管理</h2>',`<h2>順位・決勝</h2>${rankingViewSwitch()}`);}
function ranking(){
 const groups=rankingGroups(),cats=[...new Set(groups.map(g=>g.cat))];
 const loading=state.rankingLoading||!state.approvedLoaded;
 const banner=state.approvedError?`<div class="empty-error">順位の取得に失敗しました：${esc(state.approvedError)}。更新してください。</div>`:loading?'<p class="prompt">順位を読み込み中…</p>':'';
 return `${controls()}<h2>予選順位・承認管理</h2>${banner}${cats.map(cat=>`<h2>${esc(catName(cat))}</h2>${groups.filter(g=>g.cat===cat).map(g=>{
  const rows=state.rankingRows[g.key]||[],err=state.rankingLoadErrors[g.key];
  const approved=state.approved.filter(x=>x.category_id===g.cat&&x.group_name===g.group);
  const approvedMap=new Map(approved.map(x=>[x.pair_id,x.rank]));
  const active=state.pairs.filter(x=>x.category_id===g.cat&&x.group_name===g.group&&x.participation_status==='active');
  const complete=g.games.length>0&&g.games.every(m=>(isDone(m)&&m.score_a!==m.score_b&&m.pair_a_id&&m.pair_b_id)||(isWalkover(m)&&m.walkover_winner_pair_id&&(m.walkover_winner_pair_id===m.pair_a_id||m.walkover_winner_pair_id===m.pair_b_id)));
  const tied=rows.some((r,i)=>rows.findIndex(x=>Number(x.rank)===Number(r.rank))!==i);
  const qualified=state.qualificationLocks.includes(cat);

  const ready=!loading&&!err&&complete&&rows.length>=2&&rows.length===active.length&&approved.length===0;
  const status=approved.length?'正式承認済み':!complete?'試合未終了':tied?'同順位あり':'未承認';

function csvCells(text){
  const rows=[];let row=[],cell='',quoted=false;
  text=String(text).replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"'){quoted=false;}else cell+=c;}
    else if(c==='"'){if(cell!=='')throw Error('CSVの引用符の位置が不正です。');quoted=true;}
    else if(c===','){row.push(cell);cell='';}
    else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=c;
  }
  if(quoted)throw Error('CSVの引用符が閉じられていません。');
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}
