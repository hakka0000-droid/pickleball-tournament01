async function readPairImportFile(file){
  if(!file||pairImport.busy)return;
  pairImport.fileName=file.name;pairImport.fileErrors=[];pairImport.rows=[];pairImport.message='';
  try{
    if(file.size>3*1024*1024)throw Error('ファイルは3MB以下にしてください。');
    let grid;
    if(/\.csv$/i.test(file.name))grid=csvCells(await file.text());
    else if(/\.xlsx$/i.test(file.name)){
      if(!window.XLSX)throw Error('Excel読み込みライブラリを取得できません。CSV形式で保存し直すかネットワークを確認してください。');
      const book=window.XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});
      if(!book.SheetNames.length)throw Error('Excelにシートがありません。');
      grid=window.XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:'',blankrows:true,raw:false});
    }else throw Error('対応形式は .xlsx と .csv です。');
    if(!grid.length)throw Error('ファイルが空です。');
    const header=grid[0].map(x=>String(x??'').trim().replace(/^\uFEFF/,''));
    if(header.length!==4||header.some((v,i)=>v!==importColumns[i]))throw Error('先頭行は「カテゴリー,選手1,選手2,女性選手数」の4列にしてください。');
    for(let i=1;i<grid.length;i++){
      const r=grid[i];if(r.every(v=>String(v??'').trim()===''))continue;
      if(r.length>4&&r.slice(4).some(v=>String(v??'').trim()!==''))throw Error(`${i+1}行目に5列目以降のデータがあります。`);
      pairImport.rows.push({line:i+1,category:r[0],player1:r[1],player2:r[2],female:r[3]});
    }
    if(pairImport.rows.length<1||pairImport.rows.length>256)throw Error('データは1〜256ペアにしてください。');
  }catch(e){pairImport.rows=[];pairImport.fileErrors=[e.message];}
  render();
}

async function completeTournamentFromUi(){

}

async function fetchAll(name,columns='*',order='id'){let out=[],from=0;for(;;){let q=client.from(name).select(columns).range(from,from+499);if(order)q=q.order(order,{ascending:true});let {data,error}=await q;if(error)throw Error(name+' : '+error.message);out.push(...(data||[]));if(!data||data.length<500)break;from+=500;if(from>=10000)throw Error(name+' : 10000行超のため取得を停止しました')}return out}
let matchNumberLoadVersion=0;
async function refreshMatchNumbers(){
 const version=++matchNumberLoadVersion;
 const userId=state.auth?.id||null;
 const staffEnabled=!!userId&&state.staff;
 const tournaments=state.tournaments.map(t=>t.id);
 const loaded={};const issues=[];
 try{
  // Public listing is filtered by its database view (draft stays hidden).
  const publicRows=await fetchAll('public_match_numbers','match_id,tournament_id,match_code','match_id');
  if(version!==matchNumberLoadVersion||userId!==(state.auth?.id||null))return;
  for(const n of publicRows){if(n.match_id&&/^M-\d{3,}$/.test(n.match_code))loaded[n.match_id]=n.match_code;}
 }catch(e){issues.push('公開試合番号: '+e.message);}
 if(staffEnabled){
  // The server RPC itself checks active staff membership per tournament.
  for(const tid of tournaments){
   if(version!==matchNumberLoadVersion||userId!==(state.auth?.id||null)||!state.staff)return;
   const {data,error}=await client.rpc('staff_get_tournament_match_numbers',{p_tournament_id:tid});
   if(error){
    // No membership on this particular tournament is expected and not an error.
    if(!/permission required/i.test(error.message))issues.push('スタッフ試合番号: '+error.message);
    continue;
   }
   for(const n of data||[]){if(n.match_id&&/^M-\d{3,}$/.test(n.match_code))loaded[n.match_id]=n.match_code;}
  }
 }
 if(version!==matchNumberLoadVersion||userId!==(state.auth?.id||null)||staffEnabled!==(!!state.auth?.id&&state.staff))return;
 state.matchNumbers=loaded;
 state.matchNumberError=issues.join(' / ');
 render();
}

async function refreshAuth(){
 if(!client)return;
 const {data,error}=await client.auth.getUser();const user=error?null:data.user||null;
 permissionDiagnostic.rows=[];permissionDiagnostic.message='';permissionDiagnostic.checkedAt='';matchNumberLoadVersion++;state.matchNumbers={};state.matchNumberError='';state.auth=user;state.staff=false;state.staffError='';state.systemAdmin=false;state.systemAdminLoaded=false;state.systemAdminError='';state.tournamentAdminIds=[];state.tournamentStaffIds=[];state.tournamentAdminLoaded=false;state.tournamentAdminError='';
 if(user){
  const [roleResult,adminResult,staffResult]=await Promise.all([
   client.from('staff_users').select('user_id').eq('user_id',user.id).eq('is_active',true).maybeSingle(),
   client.rpc('get_my_system_admin_status'),
   client.from('tournament_staff').select('tournament_id,role').eq('user_id',user.id)
  ]);
  if(state.auth?.id!==user.id)return;
  state.staff=!roleResult.error&&!!roleResult.data;state.staffError=roleResult.error?.message||'';
  state.systemAdmin=!adminResult.error&&adminResult.data===true;state.systemAdminLoaded=!adminResult.error;state.systemAdminError=adminResult.error?.message||'';
  state.tournamentAdminError=staffResult.error?.message||'';
  state.tournamentAdminLoaded=!staffResult.error;
  state.tournamentAdminIds=state.staff&&!staffResult.error?(staffResult.data||[]).filter(x=>x.role==='admin').map(x=>x.tournament_id):[];
  state.tournamentStaffIds=state.staff&&!staffResult.error?(staffResult.data||[]).filter(x=>['admin','staff'].includes(x.role)).map(x=>x.tournament_id):[];
 }
 if(!state.staff&&(areaOf(state.tab)==='ops'||areaOf(state.tab)==='staff'))state.tab='public_home';if(state.tab==='manage'&&!canOpenManage())state.tab='public_home';
 state.qualificationLocksLoaded=false;state.qualificationLocks=[];render();if(!state.loading)await refreshMatchNumbers();
}

function editScore(id){if(!state.staff){alert('スタッフ認証が必要です。');return}const m=state.matches.find(x=>x.id===id);if(!m)return;if(officialLocked(m.category_id)){alert('正式確定済み、または正式結果の状態を取得できません。更新してください。');return}if(preliminaryEditLocked(m)){alert(state.qualificationLocks.includes(m.category_id)?'決勝進出者が確定済みのため、予選結果を編集できません。':'決勝進出者の確定状態を確認できないため、予選結果の編集を停止しています。更新してください。');return}const unresolved=!m.pair_a_id||!m.pair_b_id;const walk=isWalkover(m);const scored=isDone(m);modal(`<div class="row"><h2 style="margin:0">試合結果・不戦勝</h2><button class="btn secondary mini-btn" data-close>閉じる</button></div><p class="prompt">${matchCode(m)?esc(matchCode(m))+' ／ ':''}${esc(catName(m.category_id))} / ${esc(stageLabel(m))}</p><p><b>${esc(pairName(m.pair_a_id))}</b> vs <b>${esc(pairName(m.pair_b_id))}</b></p><p class="prompt">現在：${walk?'不戦勝（'+esc(winnerName(m))+'）':isDone(m)?m.score_a+' - '+m.score_b:esc(m.status)}</p>${unresolved?'<div class="notice">対戦相手が未確定のため結果を保存できません。</div>':''}<div class="scoreinputs"><div><label>${esc(pairName(m.pair_a_id))}</label><input class="field" id="scoreA" type="number" inputmode="numeric" min="0" max="99" ${scored||walk?'disabled':''} value="${m.score_a??''}"></div><div><label>${esc(pairName(m.pair_b_id))}</label><input class="field" id="scoreB" type="number" inputmode="numeric" min="0" max="99" ${scored||walk?'disabled':''} value="${m.score_b??''}"></div></div>${scored?'<div class="notice">登録済みの得点は直接修正できません。「試合結果を取り消す」で理由を記録し、再読み込み後に新しい得点を登録してください。</div>':'<p class="prompt">最終得点を入力。後続の試合開始後は勝者変更できません。</p>'}<p id="editMsg" class="empty-error hide" role="alert"></p><div class="modal-actions"><button class="btn" id="saveScore" ${unresolved||walk||scored?'disabled':''}>結果を保存</button><button class="btn secondary" id="confirmWalkover" ${unresolved||isDone(m)||m.status==='playing'||m.status==='cancelled'?'disabled':''}>不戦勝を確定・訂正</button>${walk?'<button class="btn secondary" id="revokeWalkover">不戦勝を取り消す</button>':''}${isDone(m)?'<button class="btn secondary" id="revokeScore">試合結果を取り消す</button>':''}</div>`);
