function scoreCard(m){const v=scores[m.id];return `<article class="card match"><div class="row"><span class="stage">${esc(label(m))} / ${esc(m['ステージ'])} ${m['グループ']?'/ '+esc(m['グループ'])+'組':''}</span><span class="status ${v?'done':m['ペアA'].includes('位')||m['ペアA'].includes('勝者')||m['ペアB'].includes('位')?'pending':''}">${v?'結果登録済':(m['ペアA'].includes('位')||m['ペアA'].includes('勝者'))?'進出者未確定':'予定'}</span></div><div class="teams">${esc(m['ペアA'])}<br><span class="muted">vs</span><br>${esc(m['ペアB'])}</div><div class="row"><small class="muted">${m['開始']}–${m['終了']}　コート ${m['コート']}　${m.id}</small>${v?`<span class="score">${v.a} - ${v.b}</span>`:''}</div><div class="row" style="margin-top:10px"><span class="secondary-text">${v?'結果はこの端末に保存':''}</span><button class="btn secondary" onclick="edit('${m.id}')">${v?'結果修正':'結果入力'}</button></div></article>`}

function filtered(){return MATCHES.filter(m=>(filterCat==='all'||m['カテゴリー']===filterCat)&&(filterTime==='all'||m['開始']===filterTime))}
function home(){const n=Object.keys(scores).filter(id=>MATCHES.some(m=>m.id===id)).length;const upcoming=MATCHES.filter(m=>!scores[m.id]).slice(0,4);return `<div class="metrics"><div class="metric"><small>結果登録</small><strong>${n}<span class="muted mini"> /91</span></strong></div><div class="metric"><small>未登録</small><strong>${91-n}</strong></div><div class="metric"><small>公式コート</small><strong>8<span class="mini muted"> 面</span></strong></div></div><div class="progress"><div style="width:${100*n/91}%"></div></div><div class="notice">この試作版の結果は<b>操作した端末だけ</b>に保存されます。参加者や他のスタッフとはまだ同期されません。実際の大会運用には使わないでください。</div><h2>操作を始める</h2><div class="grid"><button class="btn" onclick="view('courts')">コート別の進行表 →</button><button class="btn secondary" onclick="view('matches')">スコアを入力 →</button><button class="btn secondary" onclick="view('ranking')">順位表を見る →</button></div><h2>大会の設定</h2><div class="card"><div class="row"><span>オープン初級</span><b>16ペア</b></div><div class="line"></div><div class="row"><span>中級チャレンジ</span><b>12ペア</b></div><div class="line"></div><div class="row"><span>女子中級</span><b>8ペア</b></div><div class="line"></div><div class="row"><span>上級オープン</span><b>6ペア</b></div></div><h2>デモデータの管理</h2><div class="card"><div class="flex" style="flex-wrap:wrap"><button class="btn secondary" onclick="downloadResults()">結果をJSONで保存</button><button class="btn secondary" onclick="document.getElementById('upload').click()">結果を読込</button><input id="upload" class="hide" type="file" accept=".json,application/json" onchange="uploadResults(event)"><button class="btn secondary" onclick="clearResults()">結果を初期化</button></div></div>`}
function courts(){const grouped=Object.groupBy?Object.groupBy(filtered(),m=>m['開始']):null;return `<h2>コート別スケジュール</h2>${selectControls()}<div class="notice blue">コート9〜12は15:00以降の交流試合専用（公式戦の対象外）です。</div>${ttimes.filter(t=>filterTime==='all'||filterTime===t).map(t=>{let a=filtered().filter(m=>m['開始']===t);return `<h2>${t}–${a[0]?.['終了']||''} <small class="muted">${a.length}試合</small></h2><div class="grid">${a.map(m=>scoreCard(m)).join('')||'<div class="empty">該当試合なし</div>'}</div>`}).join('')}`}
function matches(){return `<h2>試合一覧・結果入力</h2>${selectControls()}<p class="secondary-text">${filtered().length}試合を表示中。試合カードから結果を入力できます。</p><div class="grid">${filtered().map(scoreCard).join('')}</div>`}
function buildStandings(cat,group){let pool=MATCHES.filter(m=>m['カテゴリー']===cat&&(cat==='上級'?m['ステージ']==='総当たり':m['ステージ']==='予選'&&m['グループ']===group));let ids=[...new Set(pool.flatMap(m=>[m['ペアA'],m['ペアB']]))].sort();let result=ids.map(id=>({id,w:0,l:0,pf:0,pa:0,played:0}));const map=Object.fromEntries(result.map(x=>[x.id,x]));pool.forEach(m=>{let v=scores[m.id];if(!v)return;let a=map[m['ペアA']],b=map[m['ペアB']];if(!a||!b)return;for(let [x,own,against] of [[a,v.a,v.b],[b,v.b,v.a]]){x.played++;x.pf+=own;x.pa+=against;x.w+=own>against?1:0;x.l+=own<against?1:0}});result.sort((a,b)=>b.w-a.w||(b.pf-b.pa)-(a.pf-a.pa)||b.pf-a.pf||a.id.localeCompare(b.id));return {result,pool}}
function ranking(){const gr=standCat==='上級'?'A':standGroup;const z=buildStandings(standCat,gr);const groups=standCat==='初級'?['A','B','C','D']:standCat==='中級チャレンジ'?['A','B','C']:['A','B'];return `<h2>予選・総当たり順位（暫定）</h2><div class="filters"><div><label>カテゴリー</label><select class="field" onchange="standCat=this.value;standGroup='A';render()">${opts(CAT.map(c=>[c,LABEL[c]]),standCat)}</select></div>${standCat==='上級'?'':`<div><label>リーグ</label><select class="field" onchange="standGroup=this.value;render()">${opts(groups.map(g=>[g,g+'組']),standGroup)}</select></div>`}</div><div class="notice blue">順位は勝利数→得失点差→総得点による<b>デモ暫定順位</b>です。同率時の公式順位・決勝進出は、正式な大会ルールに基づきスタッフが別途承認する必要があります。</div><div class="card tablebox"><table class="tbl"><thead><tr><th>仮順位</th><th>ペア</th><th>勝</th><th>負</th><th>得失点</th><th>消化</th></tr></thead><tbody>${z.result.map((a,i)=>`<tr><td>${i+1}</td><td><b>${esc(a.id)}</b></td><td>${a.w}</td><td>${a.l}</td><td>${a.pf-a.pa>0?'+':''}${a.pf-a.pa}</td><td>${a.played}</td></tr>`).join('')}</tbody></table></div><small class="muted">対象 ${z.pool.length}試合 / 結果登録 ${z.pool.filter(m=>scores[m.id]).length}試合</small>`}
function pairs(){const selected=teamList.filter(id=>filterTeam==='all'||id===filterTeam);return `<h2>ペア別 試合確認</h2><label>ペアを選択</label><select class="field" onchange="filterTeam=this.value;render()">${opts([['all','ペアを選んでください'],...teamList.map(id=>[id,id])],filterTeam)}</select>${filterTeam==='all'?'<div class="empty">ペアを選択すると、試合予定と結果を表示します。</div>':`<h2>${esc(filterTeam)} の試合</h2><div class="grid">${MATCHES.filter(m=>m['ペアA']===filterTeam||m['ペアB']===filterTeam).map(scoreCard).join('')}</div><div class="notice blue">決勝・順位戦の対戦相手は、予選確定後に登録する必要があります。現在は仮枠のため表示されません。</div>`}`}
function render(){if(remoteMode){renderRemote();return}navbar();document.getElementById('screen').innerHTML=({home,courts,matches,ranking,pairs})[current]()+'<footer>試作版 v1.0｜端末内デモ／本番利用不可</footer>'}
function edit(id){let m=MATCHES.find(x=>x.id===id),s=scores[id]||{a:'',b:''};document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div class="row"><h2 style="margin:0">結果入力</h2><button class="btn secondary" onclick="closeModal()">閉じる</button></div><p class="secondary-text">${m.id} / ${esc(label(m))} / ${esc(m['ステージ'])}<br>${m['開始']}〜${m['終了']} / コート${m['コート']}</p><div class="scoreinputs"><div><label>${esc(m['ペアA'])}</label><input class="field" id="sa" inputmode="numeric" type="number" min="0" max="99" value="${s.a}"></div><div><label>${esc(m['ペアB'])}</label><input class="field" id="sb" inputmode="numeric" type="number" min="0" max="99" value="${s.b}"></div></div><div class="notice">結果はこの端末のみ保存されます。ハンデは自動加算しません。最終得点を入力してください。未確定の進出者枠は登録しないでください。</div><button class="btn" style="width:100%" onclick="saveScore('${id}')">結果を保存</button>${scores[id]?`<button class="btn secondary" style="width:100%;margin-top:10px" onclick="deleteScore('${id}')">登録を取り消す</button>`:''}</div></div>`}
function closeModal(e){if(e && e.target!==e.currentTarget)return;document.getElementById('overlay').innerHTML=''}
function saveScore(id){let a=Number(document.getElementById('sa').value),b=Number(document.getElementById('sb').value);let sa=document.getElementById('sa').value,sb=document.getElementById('sb').value;if(!sa||!sb||!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a===b||a>99||b>99){alert('異なる0〜99の整数を入力してください');return}let m=MATCHES.find(x=>x.id===id);if([m['ペアA'],m['ペアB']].some(x=>x.includes('位')||x.includes('勝者'))){alert('この試合は進出者が未確定です。第1版では結果を登録しないでください');return}scores[id]={a,b};persist();closeModal();render()}
function deleteScore(id){if(!confirm('この試合の結果を消去しますか？'))return;delete scores[id];persist();closeModal();render()}
function persist(){localStorage.setItem(KEY,JSON.stringify(scores))}
function clearResults(){if(!confirm('この端末の全試合結果を消去しますか？'))return;scores={};persist();render()}
function downloadResults(){let blob=new Blob([JSON.stringify({version:1,results:scores},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pickleball_demo_results.json';a.click();URL.revokeObjectURL(url)}
function uploadResults(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(x.version!==1||typeof x.results!=='object'||Array.isArray(x.results))throw Error();scores=x.results;persist();render();alert('読み込みました')}catch(err){alert('読み込めない形式です')}};reader.readAsText(f)}

// --- Supabase read-only mode (remote writes deliberately disabled) ---
const REMOTE_CONFIG_KEY='pickleball_supabase_public_config_v2';
let remoteConfig={url:'',key:''};
try{remoteConfig=JSON.parse(localStorage.getItem(REMOTE_CONFIG_KEY)||'{}')}catch(e){}
let remoteMode=false, remoteRows=null, remoteError='',remoteTab='home',remoteCat='all',remoteGroup='all',remotePair='all',remoteLoading=false;
const remoteNames={beginner:'オープン初級',challenge:'中級チャレンジ',women:'女子中級',advanced:'上級オープン'};
function remoteMsg(x){document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><h2>接続設定</h2><p class="secondary-text">SupabaseのProject URLとPublishable keyを入力してください。Secret keyやservice_role keyは絶対に入力しないでください。</p><label>Project URL</label><input class="field" id="remoteUrl" type="url" placeholder="https://xxxxx.supabase.co" value="${esc(remoteConfig.url||'')}"><div style="height:12px"></div><label>Publishable key</label><input class="field" id="remoteKey" type="text" placeholder="sb_publishable_..." value="${esc(remoteConfig.key||'')}"><div class="flex" style="margin-top:15px"><button class="btn" onclick="remoteSaveConfig()">保存して接続</button><button class="btn secondary" onclick="closeModal()">閉じる</button></div><p class="secondary-text">接続設定はこの端末のブラウザに保存されます。公開情報の読み取り専用です。</p></div></div>`}
function remoteSaveConfig(){let url=document.getElementById('remoteUrl').value.trim().replace(/\/+$/,''),key=document.getElementById('remoteKey').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||!key.startsWith('sb_publishable_')){alert('Project URLとPublishable keyを確認してください。');return}remoteConfig={url,key};localStorage.setItem(REMOTE_CONFIG_KEY,JSON.stringify(remoteConfig));closeModal();remoteFetch()}
async function remoteFetch(){if(!remoteConfig.url||!remoteConfig.key){remoteError='接続設定が未入力です。';renderRemote();remoteMsg();return}remoteLoading=true;remoteError='';renderRemote();let base=remoteConfig.url+'/rest/v1/',headers={'apikey':remoteConfig.key};try{let names=['tournaments','categories','pairs','courts','matches'];let results=await Promise.all(names.map(async name=>{let response=await fetch(base+name+'?select=*'+(name==='matches'?'&order=id.asc':''),{headers,cache:'no-store'});if(!response.ok){let detail=await response.text();throw Error(name+' (HTTP '+response.status+'): '+detail.slice(0,160))}return [name,await response.json()]}));remoteRows=Object.fromEntries(results);remoteError=''}catch(e){remoteRows=null;remoteError='読込失敗：'+e.message}finally{remoteLoading=false;renderRemote()}}
function remoteNavigate(tab){remoteTab=tab;renderRemote();window.scrollTo(0,0)}
function remoteCatName(id){let c=(remoteRows?.categories||[]).find(x=>x.id===id);return c?.name||remoteNames[id]||id}
function remotePairName(id){if(!id)return '対戦相手未確定';let p=(remoteRows?.pairs||[]).find(x=>x.id===id);return p?.display_name||id}
function remoteMatch(m){let a=remotePairName(m.pair_a_id),b=remotePairName(m.pair_b_id),done=m.status==='completed'&&m.score_a!==null&&m.score_b!==null;let time=m.start_time?new Date(m.start_time).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'時刻未設定';return `<article class="card match"><div class="row"><span class="stage">${esc(remoteCatName(m.category_id))} / ${esc(m.phase||'')} ${m.group_name?' / '+esc(m.group_name)+'組':''}</span><span class="status ${done?'done':''}">${done?'結果登録済':'予定'}</span></div><div class="teams">${esc(a)}<br><span class="muted">vs</span><br>${esc(b)}</div><div class="row"><small class="muted">${esc(time)}　${m.court_id?'コート'+esc(m.court_id):'コート未定'}　${esc(m.id)}</small>${done?`<strong class="score">${m.score_a} - ${m.score_b}</strong>`:''}</div></article>`}
function remoteStanding(cat,group){let ms=(remoteRows.matches||[]).filter(m=>m.category_id===cat&&(cat==='advanced'||m.group_name===group)&&(m.phase==='preliminary'||m.phase==='round_robin'));let ps=(remoteRows.pairs||[]).filter(p=>p.category_id===cat&&(cat==='advanced'||p.group_name===group));let table=ps.map(p=>({id:p.id,name:p.display_name,w:0,l:0,d:0,pts:0,played:0})),idx=Object.fromEntries(table.map(x=>[x.id,x]));ms.forEach(m=>{if(m.status!=='completed'||m.score_a===null||m.score_b===null)return;let a=idx[m.pair_a_id],b=idx[m.pair_b_id];if(!a||!b)return;a.played++;b.played++;a.d+=m.score_a-m.score_b;b.d+=m.score_b-m.score_a;a.pts+=m.score_a;b.pts+=m.score_b;if(m.score_a>m.score_b){a.w++;b.l++}if(m.score_b>m.score_a){b.w++;a.l++}});table.sort((a,b)=>b.w-a.w||b.d-a.d||b.pts-a.pts||a.id.localeCompare(b.id));return `<div class="card tablebox"><table class="tbl"><thead><tr><th>仮順位</th><th>ペア</th><th>勝</th><th>負</th><th>得失点</th><th>試合</th></tr></thead><tbody>${table.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${p.w}</td><td>${p.l}</td><td>${p.d>0?'+':''}${p.d}</td><td>${p.played}</td></tr>`).join('')||'<tr><td colspan="6">このグループにはペアが未登録です。</td></tr>'}</tbody></table></div>`}
function renderRemote(){let tabs=[['home','概要'],['matches','試合一覧'],['courts','コート別'],['ranking','順位'],['pairs','ペア検索']];document.getElementById('tabs').innerHTML=tabs.map(([k,t])=>`<button class="${remoteTab===k?'active':''}" onclick="remoteNavigate('${k}')">${t}</button>`).join('');document.getElementById('bottom').innerHTML=tabs.map(([k,t])=>`<button class="${remoteTab===k?'active':''}" onclick="remoteNavigate('${k}')">${t}</button>`).join('');let top=`<div class="notice blue"><b>Supabase共有データ（閲覧専用）</b>　<button class="btn secondary" onclick="remoteFetch()">更新</button> <button class="btn secondary" onclick="remoteMsg()">接続設定</button> <button class="btn secondary" onclick="remoteMode=false;render()">端末内デモへ</button><br><small>まだスタッフ認証がないため、共有スコアの編集は無効です。最新データを見るには「更新」を押してください。</small></div>`;let html='';if(remoteLoading)html='<div class="card">Supabaseからデータを読み込み中です…</div>';else if(remoteError)html=`<div class="notice">${esc(remoteError)}</div>`;else if(!remoteRows)html='<div class="card">接続設定を行ってください。</div>';else{let r=remoteRows,ms=r.matches||[],done=ms.filter(m=>m.status==='completed'&&m.score_a!==null&&m.score_b!==null).length;let catOpts=opts([['all','すべて'],...(r.categories||[]).map(c=>[c.id,c.name])],remoteCat);let msFiltered=ms.filter(m=>remoteCat==='all'||m.category_id===remoteCat);if(remoteTab==='home')html=`<h2>大会の状況（Supabase）</h2><div class="metrics"><div class="metric"><small>登録ペア</small><strong>${r.pairs.length}</strong></div><div class="metric"><small>登録試合</small><strong>${ms.length}</strong></div><div class="metric"><small>結果登録</small><strong>${done}</strong></div></div><div class="notice">現在のSupabaseには登録されたデータのみ表示されます。91試合のローカルデモとは別のデータです。</div><div class="card"><b>大会</b><p>${esc(r.tournaments.map(t=>t.name).join('、')||'未登録')}</p><b>カテゴリー</b><p>${r.categories.map(c=>esc(c.name)).join(' / ')}</p></div>`;if(remoteTab==='matches')html=`<h2>共有試合一覧</h2><label>カテゴリー</label><select class="field" onchange="remoteCat=this.value;renderRemote()">${catOpts}</select><p class="secondary-text">${msFiltered.length}試合を表示中</p>${msFiltered.map(remoteMatch).join('')||'<div class="empty">登録試合がありません。</div>'}`;if(remoteTab==='courts')html=`<h2>共有コート別試合</h2><label>カテゴリー</label><select class="field" onchange="remoteCat=this.value;renderRemote()">${catOpts}</select>${[...new Set(msFiltered.map(m=>m.court_id).filter(Boolean))].sort((a,b)=>a-b).map(c=>`<h2>コート ${c}</h2>${msFiltered.filter(m=>m.court_id===c).sort((a,b)=>(a.start_time||'').localeCompare(b.start_time||'')).map(remoteMatch).join('')}`).join('')||'<div class="empty">コートが設定された試合はありません。</div>'}`;if(remoteTab==='ranking'){let cs=r.categories.filter(c=>c.id===remoteCat);if(!cs.length)cs=r.categories.slice(0,1);let cat=cs[0]?.id||'beginner', groups=[...new Set(r.pairs.filter(p=>p.category_id===cat).map(p=>p.group_name||'A'))].sort();let group=groups.includes(remoteGroup)?remoteGroup:groups[0]||'A';html=`<h2>共有順位（暫定）</h2><label>カテゴリー</label><select class="field" onchange="remoteCat=this.value;remoteGroup='all';renderRemote()">${opts(r.categories.map(c=>[c.id,c.name]),cat)}</select><div style="height:10px"></div><label>リーグ</label><select class="field" onchange="remoteGroup=this.value;renderRemote()">${opts(groups.map(g=>[g,g+'組']),group)}</select><div class="notice blue">勝利数→得失点差→総得点の暫定順位です。正式順位・進出確定には使用しないでください。</div>${remoteStanding(cat,group)}`;}if(remoteTab==='pairs'){let ps=r.pairs||[];let p=ps.find(p=>p.id===remotePair)||ps[0];html=`<h2>ペア別の試合</h2><label>ペアを選択</label><select class="field" onchange="remotePair=this.value;renderRemote()">${opts(ps.map(p=>[p.id,p.display_name]),p?.id)}</select>${p?`<div class="card"><b>${esc(p.display_name)}</b><p class="secondary-text">${esc(remoteCatName(p.category_id))} / ${esc(p.group_name||'')}</p></div>${ms.filter(m=>m.pair_a_id===p.id||m.pair_b_id===p.id).map(remoteMatch).join('')||'<div class="empty">試合登録なし</div>'}`:'<div class="empty">ペア登録なし</div>'}`}}document.getElementById('screen').innerHTML=top+html+'<footer>Supabase連携 v2｜共有データ閲覧のみ・本番利用不可</footer>'}
function setRemoteMode(){remoteMode=true;remoteCat='all';remoteTab='home';if(!remoteRows)remoteFetch();else renderRemote()}

render();</script></body></html>
