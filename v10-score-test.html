<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v10 スコア保存テスト</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;max-width:700px;margin:auto;padding:18px;background:#f3f6f8;color:#203345}section{background:white;border-radius:12px;padding:18px;margin:14px 0;border:1px solid #d8e0e5}label{display:block;margin:12px 0 5px;font-weight:600}input,select,button{font:inherit;padding:11px;width:100%;box-sizing:border-box;border-radius:7px;border:1px solid #b8c7cf}button{margin-top:12px;background:#156f65;color:white;border:0;font-weight:700}button:disabled{opacity:.5}#msg{white-space:pre-wrap;overflow-wrap:anywhere;background:#eaf1f4;padding:12px;border-radius:8px}small{color:#506575} .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style></head>
<body><h1>🏓 v10 スコア保存テスト</h1><p>v10開発環境専用。保存操作をするとテスト試合のスコアが実際に更新され、監査履歴が記録されます。</p>
<section><h2>1. スタッフログイン</h2><label>メールアドレス<input id="email" type="email" autocomplete="username"></label><label>パスワード<input id="password" type="password" autocomplete="current-password"></label><button id="login">ログイン</button><button id="logout" type="button">ログアウト</button></section>
<section><h2>2. 試合を選択</h2><button id="load">試合一覧を取得</button><label>試合<select id="match"><option value="">試合を読み込んでください</option></select></label><div class="row"><label>ペアAの得点<input id="scoreA" type="number" min="0" max="99" value="11"></label><label>ペアBの得点<input id="scoreB" type="number" min="0" max="99" value="7"></label></div><button id="save">スコアを保存</button><small>保存前に試合の更新日時を再取得し、競合更新があれば保存を拒否します。</small></section>
<section><h2>3. 結果</h2><div id="msg" role="status">接続待ち</div></section>
<script src="./supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const $=id=>document.getElementById(id);const conf=window.PICKLEBALL_SUPABASE_CONFIG||{};const msg=t=>$('msg').textContent=t;
let client, rows=[];
if(!conf.url||!conf.key||!window.supabase?.createClient){msg('接続設定またはSupabaseライブラリを読み込めません。');}else{client=window.supabase.createClient(conf.url,conf.key,{auth:{persistSession:true,autoRefreshToken:true}});msg('準備完了。スタッフでログインしてください。');}
$('login').onclick=async()=>{if(!client)return;const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';msg(error?'ログイン失敗：'+error.message:'ログイン成功。次に試合一覧を取得してください。');};
$('logout').onclick=async()=>{if(!client)return;await client.auth.signOut();msg('ログアウトしました。');};
$('load').onclick=async()=>{if(!client)return;const {data,error}=await client.from('matches').select('id,category_id,group_name,status,score_a,score_b,updated_at,pair_a_id,pair_b_id').order('updated_at',{ascending:true}).limit(100);if(error){msg('取得失敗：'+error.message);return;}rows=data||[];const s=$('match');s.replaceChildren(new Option('試合を選択',''));for(let i=0;i<rows.length;i++){const m=rows[i];s.add(new Option('試合'+(i+1)+' / '+m.status+' / '+(m.score_a??'-')+' 対 '+(m.score_b??'-'),m.id));}msg(rows.length+'試合を取得しました。');};
$('save').onclick=async()=>{if(!client)return;const m=rows.find(x=>x.id===$('match').value);if(!m){msg('試合を選択してください。');return;}const a=Number($('scoreA').value),b=Number($('scoreB').value);if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a>99||b>99||a===b){msg('0～99の異なる整数を入力してください。');return;}if(!confirm('選択したテスト試合を '+a+' 対 '+b+' で保存します。よろしいですか？'))return;$('save').disabled=true;try{const {error}=await client.rpc('staff_save_score',{p_match_id:m.id,p_score_a:a,p_score_b:b,p_expected_updated_at:m.updated_at});if(error)throw error;msg('保存成功。試合一覧を再取得すると更新後の結果を確認できます。監査履歴はSQL Editorで確認してください。');}catch(e){msg('保存失敗：'+e.message);}finally{$('save').disabled=false;}};
</script></body></html>
